# CAPA Feature Registry
# Single source of truth for all cluster features.
# Used by: CLI (run-test-suite.py --feature), Jenkinsfile
#
# Each feature maps to a K8s field on a CAPA resource and knows:
#   - How to read its current value (k8s_field + resource)
#   - How to change it (playbook extra_var via var_map)
#   - What it depends on (depends_on)
#   - Whether it can be changed after creation (mutable)
#   - Which spec actions it applies to (applies_to: [create, apply, upgrade, delete])

version: "1.0"

# Feature variable mapping: feature_id -> playbook extra_var name
# Used when resolving --feature flags into playbook arguments.
var_map:
  private_network: private
  byon: byon_vpc
  availability_zones: availability_zone_count
  additional_tags: additional_tags
  etcd_kms: etcd_encryption_kms_arn
  domain_prefix: domain_prefix
  channel_group: channel_group
  # instance_type: not in var_map — template uses machine_pool.instance_type (nested), not a flat extra var
  disk_size: root_volume_size
  no_cni: no_cni
  proxy_enabled: http_proxy
  external_oidc: external_oidc
  # break_glass_credentials: action-type feature with its own playbook, no template var to map
  image_registry: image_registry_config
  parallel_upgrade: parallel_node_upgrade
  security_groups: additional_security_groups
  default_autoscaling: default_autoscaling
  cluster_autoscaler_expander: cluster_autoscaler_expander
  audit_logging: log_forward_enabled
  fips: fips

# CLI aliases: user-friendly short names -> feature_id
# These are the names users pass to --feature on the command line
cli_aliases:
  private: private_network
  no-cni: no_cni
  external-oidc: external_oidc
  break-glass: break_glass_credentials
  etcd-kms: etcd_kms
  proxy: proxy_enabled
  tags: additional_tags
  domain: domain_prefix
  channel-group: channel_group
  disk-size: disk_size
  azs: availability_zones
  byon-vpc: byon
  autoscaler: cluster_autoscaler_expander
  log-forwarding: audit_logging
  parallel-upgrade: parallel_upgrade
  image-registry: image_registry
  security-groups: security_groups
  autoscaling: default_autoscaling

# Features valid for --feature CLI flag (Day1 creation features).
# Only features with working template conditionals are listed here.
#
# Excluded from CLI (with reason):
# instance_type: template uses machine_pool.instance_type (nested), not settable via flat extra var
# proxy_enabled: requires http_proxy_url/https_proxy_url/no_proxy inputs not wired through feature manager
# sts: always enabled, not user-toggleable
# identity_provider: Day2 feature, configured post-creation
# machine_pool_autoscaling: managed via separate machinepool suites (27/28)
# control_plane_upgrade: Day2 operation with its own suite (25)
# machine_pool_upgrade: Day2 operation with its own suite (26)
# node_taints: Day2 feature, applied post-creation
# node_labels: Day2 feature, applied post-creation
# cluster_delete: destructive action with its own suite (30)
cli_features:
  - private_network
  - byon
  - no_cni
  - external_oidc
  - break_glass_credentials
  - etcd_kms
  - additional_tags
  - domain_prefix
  - channel_group
  - disk_size
  - availability_zones
  - image_registry
  - parallel_upgrade
  - security_groups
  - cluster_autoscaler_expander
  - audit_logging
  - fips
  - default_autoscaling

# Dependency rules: feature_id -> list of prerequisites
dependencies:
  byon:
    - private_network
  break_glass_credentials:
    - external_oidc
  fips:
    - etcd_kms

# Mutual exclusion rules: features that cannot be combined
mutual_exclusions: []

# Feature groups: named presets for --feature-group
# day1-basic uses default provisioning (no extra features needed)
# Other groups add --feature flags on top of the defaults
feature_groups:
  day1-basic:
    description: "Default provisioning (DomainPrefix, AZs, Tags, ChannelGroup, Autoscaling)"
    features:
      - domain_prefix
      - availability_zones
      - additional_tags
      - channel_group
      - default_autoscaling

  day1-combo:
    description: "Non-default Day1 features (does NOT include day1-basic; combine with --feature-group day1-basic if you want both)"
    features:
      - cluster_autoscaler_expander
      - image_registry
      - parallel_upgrade
      - disk_size

  day1-security:
    description: "Security features (requires AWS KMS key and security group IDs)"
    features:
      - etcd_kms
      - fips
      - security_groups

  day1-networking:
    description: "Network/auth features (no-CNI, private endpoint, OIDC, log forwarding)"
    features:
      - no_cni
      - private_network
      - external_oidc
      - audit_logging

# Scenarios: self-contained, runnable feature tests for --scenario.
#
# A scenario bundles everything a run needs so nothing has to be typed by hand:
#   which features      (feature_group / features / extends)
#   their inputs        (extra_vars, with ${ENV_VAR} pulled from the environment)
#   which suites to run (stages)
#   version quirks      (version_overrides)
#
# Applicable OpenShift versions are COMPUTED, not listed: a scenario is valid on
# every supported_version that satisfies the min/max_version of all its features
# (see version-compatibility.yml). Adding a version to supported_versions makes
# every compatible scenario runnable there with no edits here.
#
# Usage:
#   ./run-test-suite.py --list-scenarios
#   ./run-test-suite.py --scenario day1-basic -e openshift_version=5.0
#   ./run-test-suite.py --scenario day1-security --validate-only

# Applied to every scenario unless the scenario overrides the key.
scenario_defaults:
  # Ordered suite IDs. A bare string runs only if all prior stages passed.
  # {suite: X, always: true} runs even after a failure (cleanup/restore).
  stages:
    - 10-configure-mce-environment
    - 20-rosa-hcp-provision
    - 21-verify-feature-flags
    - {suite: 30-rosa-hcp-delete, always: true}
    # 41-disable-capi-enable-hypershift is deliberately NOT a default stage.
    # It switches MCE from CAPI back to HyperShift, which is hub-wide state. On
    # a shared hub that disrupts anyone else relying on CAPI mode, and a test
    # run should not reconfigure the hub out from under them. Add it explicitly
    # when you do want the hub restored:
    #   ./run-test-suite.py --scenario <name> --stages 10,20,21,30,41

  # Per-version extra_vars applied when that version is selected.
  # Override feature defaults and scenario extra_vars; CLI -e still wins.
  version_overrides:
    # 5.0 ships only as early-candidate builds, so OCM cannot resolve it on
    # the stable channel (see deprecation_warnings in version-compatibility.yml).
    #
    # openshift_version pins the exact build. Without it, `-e openshift_version=5.0`
    # reaches OCM as a bare family; its search= query cannot see EC builds, so it
    # silently falls back to a fabricated 5.0.0 and provisions a cluster that is
    # doomed from the start — ~40 wasted minutes and real AWS spend. A pin only
    # applies when the caller named a family; an exact build is always honoured.
    "5.0":
      channel_group: candidate
      openshift_version: 5.0.0-rc.0

scenarios:
  day1-basic:
    description: "Baseline provisioning: domain prefix, AZs, tags, channel group, default autoscaling"
    feature_group: day1-basic
    estimated_minutes: 75

  day1-combo:
    description: "Non-default Day1 features: autoscaler expander, image registry, parallel upgrade, disk size"
    feature_group: day1-combo
    estimated_minutes: 75

  day2-machinepool:
    description: "Day-2 machine pool lifecycle: provision, add a pool, delete it, tear down"
    # The add/delete playbooks and suites 27/28 already exist, and the nightly
    # Jenkins job runs them (Jenkinsfile:438,468). This scenario is not new
    # coverage — it is the same lifecycle runnable from a laptop with one
    # command, without a Jenkins build.
    #
    # Reuses the day1-basic features deliberately. This is about the day-2
    # stages, not new feature flags: node_labels, node_taints and
    # machine_pool_autoscaling are registry entries that add_rosa_machine_pool.yml
    # does not implement (it handles instance_type and replicas only), and the
    # day-2 ids are absent from cli_features because suites configure them via
    # extra_vars rather than --feature. Verifying a known baseline at 21 first
    # means a day-2 failure is attributable to the pool operation rather than to
    # a cluster that was never right to begin with.
    feature_group: day1-basic
    # Overrides scenario_defaults.stages — the only scenario that continues past
    # verification. 28 is always so a failed add still removes whatever pool it
    # managed to create; 30 is always so the cluster is torn down after that.
    # 41 stays out, same hub-wide reason as the defaults above.
    stages:
      - 10-configure-mce-environment
      - 20-rosa-hcp-provision
      - 21-verify-feature-flags
      - 27-rosa-hcp-add-machinepool
      - {suite: 28-rosa-hcp-delete-machinepool, always: true}
      - {suite: 30-rosa-hcp-delete, always: true}
    estimated_minutes: 90

  day1-security:
    description: "Security features: etcd KMS encryption, FIPS, additional security groups"
    feature_group: day1-security
    # Account-specific values stay out of git. Set these in the environment
    # (Jenkins credentials, or export locally) — the scenario wires them through.
    extra_vars:
      etcd_encryption_kms_arn: "${ETCD_KMS_ARN}"
      # additional_security_groups is deliberately absent. tasks/create_security_group.yml
      # reads the VPC from the ROSANetwork status and creates <cluster>-test-sg during
      # provisioning, then appends it. The group cannot exist before the VPC does, so
      # demanding it as an input here is unsatisfiable.
    estimated_minutes: 80

  day1-networking:
    description: "Network/auth features: no-CNI, private endpoint, external OIDC, audit log forwarding"
    feature_group: day1-networking
    extra_vars:
      log_forward_s3_bucket: "${CAPI_TEST_LOG_S3_BUCKET}"
    estimated_minutes: 85

suites:
  - id: cluster-config
    name: Cluster Configuration
    description: Core cluster provisioning features that are set at creation time
    category: Infrastructure
    phase: Day1
    features:
      - id: private_network
        name: Private Network
        description: Enable private cluster networking with private subnets only (no public API endpoint). Auto-extracts private subnets from ROSANetwork or accepts user-provided subnet IDs.
        type: boolean
        mutable: false
        applies_to: [create]
        default: false
        k8s_field: ".spec.endpointAccess"
        resource: ROSAControlPlane

      - id: byon
        name: Bring Your Own Network (BYON)
        description: Use pre-existing VPC and subnets instead of auto-created ROSANetwork. Requires subnet IDs via -e byon_subnet_ids=[...] and availability zones via -e byon_availability_zones=[...]
        type: boolean
        mutable: false
        applies_to: [create]
        default: false
        requires_input: true
        # var_map maps byon -> byon_vpc, but that is only the enable flag.
        # The actual user-supplied inputs are the subnet IDs and AZs.
        required_vars:
          - byon_subnet_ids
          - byon_availability_zones
        k8s_field: ".spec.subnets"
        resource: ROSAControlPlane

      - id: sts
        name: STS Mode
        description: Use AWS Security Token Service for authentication
        type: boolean
        mutable: false
        applies_to: [create]
        default: true
        k8s_field: ".spec.sts"
        resource: ROSAControlPlane

      - id: availability_zones
        name: Availability Zones
        description: "Number of availability zones for HA (1-3)"
        type: select
        options: ["1", "2", "3"]
        mutable: false
        applies_to: [create]
        default: "2"
        k8s_field: ".spec.availabilityZones"
        resource: ROSANetwork

      - id: additional_tags
        name: Additional Tags
        description: Custom AWS tags applied to all cluster resources
        type: key_value
        mutable: true
        applies_to: [create, apply]
        default: {}
        ci_default:
          Team: PICS
          Jira: RHACM4K-61815
        k8s_field: ".spec.additionalTags"
        resource: ROSAControlPlane

  - id: security-auth
    name: Security & Authentication
    description: Identity, encryption, and access control features
    category: Security
    phase: Day1
    features:
      - id: identity_provider
        name: Identity Provider
        description: "Configure cluster identity provider (LDAP, GitHub, etc.)"
        type: select
        options: ["none", "htpasswd", "ldap", "github", "google"]
        mutable: true
        applies_to: [create, apply]
        default: none
        k8s_field: ".spec.identityProviders"
        resource: ROSAControlPlane

      - id: external_oidc
        name: External OIDC
        description: Use external OIDC provider for cluster authentication
        type: boolean
        mutable: false
        applies_to: [create]
        default: false
        k8s_field: ".spec.enableExternalAuthProviders"
        resource: ROSAControlPlane
        min_version: "4.19"

      - id: break_glass_credentials
        name: Break Glass Credentials
        description: Validate OCM break-glass credential create/list for external-auth clusters (diagnoses 403 Forbidden)
        type: action
        mutable: false
        applies_to: [verify]
        default: null
        k8s_field: ".spec.externalAuthProviders"
        resource: ROSAControlPlane
        min_version: "4.19"
        playbook: playbooks/verify_break_glass_credentials.yml

      - id: security_groups
        name: Additional Security Groups
        description: Attach extra AWS security groups to cluster nodes
        type: list
        mutable: true
        applies_to: [create, apply]
        default: []
        # Created during provisioning, not supplied by the caller — see above.
        requires_input: false
        k8s_field: ".spec.additionalSecurityGroups"
        resource: ROSAMachinePool

      - id: etcd_kms
        name: ETCD KMS Encryption
        description: Encrypt etcd data with AWS KMS key
        type: string
        mutable: false
        applies_to: [create]
        default: ""
        requires_input: true
        k8s_field: ".spec.etcdEncryptionKMSARN"
        resource: ROSAControlPlane
        placeholder: "arn:aws:kms:..."

      - id: fips
        name: FIPS Mode
        description: Enable FIPS 140-2 compliance mode
        type: boolean
        mutable: false
        applies_to: [create]
        default: false
        k8s_field: ".spec.fips"
        resource: ROSAControlPlane
        min_version: "4.21"

  - id: machine-pool-scaling
    name: Machine Pool & Auto-Scaling
    description: Worker node pools, autoscaling, and upgrade strategies
    category: Scaling
    phase: Day1
    features:
      - id: default_autoscaling
        name: Default MachinePool Auto Scaling
        description: Enable autoscaling on the default machine pool (use -e mp_min_replicas=N -e mp_max_replicas=N to set range)
        type: boolean
        mutable: true
        applies_to: [create, apply]
        default: false
        k8s_field: ".spec.defaultMachinePoolSpec.autoscaling"
        resource: ROSAControlPlane

      - id: machine_pool_autoscaling
        name: Additional Machine Pool
        description: Create additional machine pool with autoscaling
        type: range
        mutable: true
        applies_to: [create, apply]
        default: {min: 1, max: 3}
        k8s_field: ".spec.autoscaling"
        resource: ROSAMachinePool

      - id: parallel_upgrade
        name: Parallel Node Upgrade
        description: Upgrade multiple nodes simultaneously during rolling updates
        type: number
        mutable: true
        applies_to: [create, apply]
        default: 1
        ci_default: 2
        k8s_field: ".spec.updateConfig.rollingUpdate"
        resource: ROSAMachinePool

      - id: cluster_autoscaler_expander
        name: Cluster Autoscaler with Expander
        description: Enable cluster autoscaler with expander strategy
        type: boolean
        mutable: true
        applies_to: [create, apply]
        default: false
        k8s_field: ".spec.autoscaler.expanders"
        resource: ROSAControlPlane

  - id: version-lifecycle
    name: Version & Lifecycle
    description: Cluster version management and upgrade operations
    category: Operations
    phase: Day2
    features:
      - id: control_plane_upgrade
        name: Control Plane Upgrade
        description: Upgrade the ROSA HCP control plane version
        type: version
        mutable: true
        applies_to: [apply, upgrade]
        default: ""
        k8s_field: ".spec.version"
        resource: ROSAControlPlane
        playbook: playbooks/upgrade_rosa_control_plane.yml
        wait_resource: ROSAControlPlane
        wait_field: ".status.ready"
        wait_value: "true"
        wait_timeout: 3600

      - id: machine_pool_upgrade
        name: Machine Pool Upgrade
        description: "Upgrade worker node pool version (must match or trail control plane)"
        type: version
        mutable: true
        applies_to: [apply, upgrade]
        default: ""
        k8s_field: ".spec.version"
        resource: ROSAMachinePool
        playbook: playbooks/upgrade_rosa_machine_pool.yml
        wait_resource: ROSAMachinePool
        wait_field: ".status.ready"
        wait_value: "true"
        wait_timeout: 3600
        depends_on: control_plane_upgrade

      - id: channel_group
        name: Channel Group
        description: "Update channel for version availability (stable, fast, candidate)"
        type: select
        options: ["stable", "fast", "candidate"]
        mutable: true
        applies_to: [create, apply, upgrade]
        default: stable
        k8s_field: ".spec.channelGroup"
        resource: ROSAControlPlane

  - id: node-config
    name: Node Configuration
    description: "Machine pool node types, disk sizes, taints, and labels"
    category: Node Configuration
    phase: Day1
    features:
      - id: instance_type
        name: Instance Type
        description: AWS EC2 instance type for worker nodes
        type: select
        options: ["m5.xlarge", "m5.2xlarge", "m5.4xlarge", "m6i.xlarge", "m6i.2xlarge", "c5.xlarge", "r5.xlarge"]
        mutable: false
        applies_to: [create]
        default: m5.xlarge
        k8s_field: ".spec.instanceType"
        resource: ROSAMachinePool

      - id: disk_size
        name: Root Disk Size (GiB)
        description: Worker node root volume size
        type: number
        mutable: false
        applies_to: [create]
        default: 300
        ci_default: 500
        k8s_field: ".spec.volumeSize"
        resource: ROSAMachinePool

      - id: node_taints
        name: Node Taints
        description: Kubernetes taints applied to worker nodes
        type: key_value
        mutable: true
        applies_to: [create, apply]
        default: {}
        k8s_field: ".spec.taints"
        resource: ROSAMachinePool

      - id: node_labels
        name: Node Labels
        description: Kubernetes labels applied to worker nodes
        type: key_value
        mutable: true
        applies_to: [create, apply]
        default: {}
        k8s_field: ".spec.nodeLabels"
        resource: ROSAMachinePool

  - id: network-connectivity
    name: Network & Connectivity
    description: "CNI, proxy, and network configuration"
    category: Networking
    phase: Day1
    features:
      - id: no_cni
        name: No CNI Plugin
        description: Deploy cluster without default CNI (BYO CNI)
        type: boolean
        mutable: false
        applies_to: [create]
        default: false
        k8s_field: ".spec.network.networkType"
        resource: ROSAControlPlane
        min_version: "4.19"

      - id: proxy_enabled
        name: Proxy Enabled
        description: Route cluster traffic through HTTP/HTTPS proxy
        type: boolean
        mutable: true
        applies_to: [create, apply]
        default: false
        k8s_field: ".spec.proxy"
        resource: ROSAControlPlane

  - id: storage-registry
    name: Storage & Registry
    description: Image registry and storage volume configuration
    category: Storage
    phase: Day1
    features:
      - id: image_registry
        name: Image Registry Config
        description: Configure cluster internal image registry
        type: boolean
        mutable: true
        applies_to: [create, apply]
        default: false
        k8s_field: ".spec.clusterRegistryConfig"
        resource: ROSAControlPlane

  - id: domain-config
    name: Domain Configuration
    description: Domain prefix configuration
    category: Configuration
    phase: Day1
    features:
      - id: domain_prefix
        name: Domain Prefix
        description: "Custom domain prefix for cluster API URL (max 15 chars)"
        type: string
        mutable: false
        applies_to: [create]
        default: ""
        k8s_field: ".spec.domainPrefix"
        resource: ROSAControlPlane
        placeholder: my-cluster
        max_length: 15

  - id: day2-operations
    name: Day2 Operations
    description: Post-deployment cluster management and monitoring
    category: Operations
    phase: Day2
    features:
      - id: cluster_delete
        name: Cluster Deletion
        description: Delete cluster and clean up all AWS resources
        type: action
        mutable: false
        applies_to: [delete]
        default: null
        playbook: playbooks/delete_rosa_hcp_cluster.yml
        wait_timeout: 2400
        destructive: true

      - id: audit_logging
        name: Audit Log Forwarding
        description: "Forward cluster audit logs to CloudWatch or S3 (requires -e log_forward_cloudwatch_role_arn=... or -e log_forward_s3_bucket=...)"
        type: boolean
        mutable: true
        applies_to: [create, apply]
        default: false
        requires_input: true
        # Without one of these groups the templates emit no cloudWatchlogForwarder
        # block at all, so the cluster provisions without log forwarding and only
        # fails ~40 minutes later during suite 21 verification.
        # Mirrors the check in playbooks/verify_feature_flags.yml.
        required_vars_any_of:
          - [log_forward_cloudwatch_role_arn, log_forward_cloudwatch_log_group]
          - [log_forward_s3_bucket]
        k8s_field: ".spec.cloudWatchlogForwarder"
        resource: ROSAControlPlane
