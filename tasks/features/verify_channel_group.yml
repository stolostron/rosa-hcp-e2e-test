---
# Feature Check: Channel Group (via OCM API + CRD cross-check)

- name: Verify Channel Group
  vars:
    expected_channel_group: "{{ channel_group | default('stable') }}"
    valid_channel_groups: ['stable', 'fast', 'candidate', 'nightly']
  block:
    - name: Assert channelGroup via OCM
      ansible.builtin.assert:
        that:
          - ocm_cluster.version.channel_group is defined
          - ocm_cluster.version.channel_group in valid_channel_groups
          - ocm_cluster.version.channel_group == expected_channel_group
        fail_msg: "FAIL: OCM channel_group does not match expected"
        success_msg: "PASS: OCM confirms channel_group matches expected"
      when: ocm_available

    - name: Assert channelGroup in CRD matches what was requested
      ansible.builtin.assert:
        that:
          - rcp.spec.channelGroup is defined
          - rcp.spec.channelGroup == expected_channel_group
        fail_msg: "FAIL: CRD channelGroup '{{ rcp.spec.channelGroup | default('undefined') }}' does not match expected '{{ expected_channel_group }}'"
        success_msg: "PASS: CRD channelGroup matches expected"

    - name: Cross-check OCM and CRD agree on channelGroup
      ansible.builtin.assert:
        that:
          - rcp.spec.channelGroup == ocm_cluster.version.channel_group
        fail_msg: "FAIL: CRD channelGroup '{{ rcp.spec.channelGroup | default('') }}' disagrees with OCM '{{ ocm_cluster.version.channel_group | default('') }}'"
        success_msg: "PASS: CRD and OCM channelGroup agree"
      when: ocm_available

    - ansible.builtin.set_fact:
        features_passed: "{{ features_passed | int + 1 }}"
  rescue:
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/verify_feature_rescue.yml"
      vars:
        feature_id: channel_group
        fail_detail: "channelGroup does not match expected value"
