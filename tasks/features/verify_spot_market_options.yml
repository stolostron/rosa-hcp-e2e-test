---
# Feature Check: Spot Market Options (via CRD + OCM API)
#
# Upstream: kubernetes-sigs/cluster-api-provider-aws#6334
#
# The OCM and CRD representations deliberately disagree for the default value.
# exp/utils/rosa_helper.go upstream:
#
#   "The ROSA API stores no max_price for an on-demand-priced spot pool, which is
#    exactly what the sentinel means."
#
# So maxPrice: "on-demand" on the CRD means spot_market_options exists in OCM with
# NO max_price key at all. Asserting max_price == "on-demand" would fail against a
# correctly configured cluster, so the two cases are checked separately below.

- name: Verify Spot Market Options
  vars:
    expected_max_price: "{{ spot_max_price | default('on-demand') }}"
    # The pattern the CRD enforces, copied from the generated schema.
    max_price_pattern: '^([1-9][0-9]*(\.[0-9]+)?|0\.[0-9]*[1-9][0-9]*|on-demand)$'
    # The OCM node pool id comes from .spec.nodePoolName, not metadata.name.
    pool_name: "{{ rmp.spec.nodePoolName | default(rmp.metadata.name) }}"
    pools: "{{ (ocm_spot_node_pools.json | default({})).get('items', []) }}"
    target_pool: "{{ pools | selectattr('id', 'equalto', pool_name) | list }}"
    aws_pool: "{{ target_pool[0].aws_node_pool | default({}) if target_pool | length == 1 else {} }}"
    # Presence of the KEY is what marks the pool as spot. Its emptiness is
    # meaningful, not a miss: an on-demand-priced spot pool is stored as an empty
    # spot_market_options object, so `| length > 0` would reject a correct cluster.
    spot_opts: "{{ aws_pool.get('spot_market_options', {}) }}"
  block:
    # Runs in suite 21, after provisioning -- this cannot save the 40 minutes, but
    # it fails with a clear message instead of a confusing "field not found".
    - name: Assert the requested max price is one the CRD would accept
      ansible.builtin.assert:
        that:
          - expected_max_price is match(max_price_pattern)
        fail_msg: >-
          FAIL: '{{ expected_max_price }}' is not a valid spot maxPrice --
          expected a price greater than zero, or "on-demand"
        success_msg: "PASS: requested maxPrice '{{ expected_max_price }}' is valid"

    # ROSAMachinePool feature: the CRD assert is unconditional, with OCM as a
    # cross-check rather than a fallback (see the skill's Step 6).
    - name: Assert spotMarketOptions via CRD
      ansible.builtin.assert:
        that:
          - rmp.spec.spotMarketOptions is defined
          - rmp.spec.spotMarketOptions.maxPrice is defined
          - rmp.spec.spotMarketOptions.maxPrice | string == expected_max_price
        fail_msg: >-
          FAIL: CRD spotMarketOptions.maxPrice is
          {{ rmp.spec.spotMarketOptions.maxPrice | default('undefined') }},
          expected {{ expected_max_price }}
        success_msg: "PASS: CRD confirms spotMarketOptions.maxPrice={{ expected_max_price }}"

    - name: Query OCM node pools for spot market options
      ansible.builtin.uri:
        url: "{{ ocm_api_url }}/api/clusters_mgmt/v1/clusters/{{ ocm_cluster.id }}/node_pools"
        method: GET
        headers:
          Authorization: "Bearer {{ ocm_token_result.json.access_token }}"
          Accept: application/json
        status_code: 200
        timeout: 15
      register: ocm_spot_node_pools
      failed_when: false
      changed_when: false
      no_log: true
      when: ocm_available and ocm_cluster.id is defined

    - name: Cross-check that OCM reports this node pool as spot
      ansible.builtin.assert:
        that:
          # The query sets failed_when: false, so a failed request is only visible here.
          - ocm_spot_node_pools.status | default(0) == 200
          # This cluster's own pool, not whichever pool OCM happened to list first.
          - target_pool | length == 1
          - "'spot_market_options' in aws_pool"
        fail_msg: >-
          FAIL: OCM node pool '{{ pool_name }}' does not report spot_market_options
          (HTTP {{ ocm_spot_node_pools.status | default('none') }},
          {{ pools | length }} pool(s) returned)
        success_msg: "PASS: OCM node pool '{{ pool_name }}' is a spot pool"
      when:
        - ocm_available
        - ocm_spot_node_pools is defined

    # Sentinel case: "on-demand" means OCM stores NO max_price. Asserting its
    # absence is what proves the sentinel round-tripped correctly -- asserting
    # equality here would fail on a correctly configured cluster.
    - name: Cross-check the on-demand sentinel via OCM (no max_price stored)
      ansible.builtin.assert:
        that:
          - "'max_price' not in spot_opts"
        fail_msg: >-
          FAIL: OCM reports max_price={{ spot_opts.max_price | default('') }} for an
          on-demand spot pool, expected no max_price to be stored
        success_msg: "PASS: OCM stores no max_price, matching the on-demand sentinel"
      when:
        - ocm_available
        - ocm_spot_node_pools is defined
        - expected_max_price == 'on-demand'

    - name: Cross-check the numeric bid via OCM
      ansible.builtin.assert:
        that:
          - "'max_price' in spot_opts"
          - spot_opts.max_price | float == expected_max_price | float
        fail_msg: >-
          FAIL: OCM reports max_price={{ spot_opts.max_price | default('absent') }},
          expected {{ expected_max_price }}
        success_msg: "PASS: OCM confirms max_price={{ expected_max_price }}"
      when:
        - ocm_available
        - ocm_spot_node_pools is defined
        - expected_max_price != 'on-demand'

    - name: Count this feature as passed
      ansible.builtin.set_fact:
        features_passed: "{{ features_passed | int + 1 }}"
  rescue:
    - name: Record the feature failure
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/verify_feature_rescue.yml"
      vars:
        feature_id: spot_market_options
        fail_detail: "spotMarketOptions not applied to the machine pool"
