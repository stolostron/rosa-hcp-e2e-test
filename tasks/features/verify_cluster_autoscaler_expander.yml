---
# Feature Check: Cluster Autoscaler Expander (via CRD)

- name: Verify Cluster Autoscaler Expander
  vars:
    valid_expanders: ['LeastWaste', 'Priority', 'Random', 'MostPods']
    expected_expander: "{{ autoscaler_expander | default('LeastWaste') }}"
  block:
    - name: Assert expander strategy via CRD
      ansible.builtin.assert:
        that:
          - rcp.spec.autoscaler is defined
          - rcp.spec.autoscaler.expanders is defined
          - rcp.spec.autoscaler.expanders | length > 0
          - rcp.spec.autoscaler.expanders | difference(valid_expanders) | length == 0
          - "expected_expander in rcp.spec.autoscaler.expanders"
        fail_msg: "FAIL: autoscaler expanders not set or do not include expected strategy"
        success_msg: "PASS: autoscaler expanders include expected strategy"

    - ansible.builtin.set_fact:
        features_passed: "{{ features_passed | int + 1 }}"
  rescue:
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/verify_feature_rescue.yml"
      vars:
        feature_id: cluster_autoscaler_expander
        fail_detail: "autoscaler expander strategy not set in CRD"
