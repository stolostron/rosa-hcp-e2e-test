---
# Feature Check: Additional Security Groups

- name: Verify Additional Security Groups
  vars:
    expected_sgs: "{{ additional_security_groups | default([]) }}"
  block:
    - name: Assert additionalSecurityGroups match requested
      ansible.builtin.assert:
        that:
          - rmp.spec.additionalSecurityGroups is defined
          - rmp.spec.additionalSecurityGroups | length > 0
          - rmp.spec.additionalSecurityGroups | sort == expected_sgs | sort
        fail_msg: "FAIL: additionalSecurityGroups do not match expected"
        success_msg: "PASS: additionalSecurityGroups match requested"
      when: expected_sgs | length > 0

    - name: Assert additionalSecurityGroups exists (no expected list to compare)
      ansible.builtin.assert:
        that:
          - rmp.spec.additionalSecurityGroups is defined
          - rmp.spec.additionalSecurityGroups | length > 0
        fail_msg: "FAIL: additionalSecurityGroups not set"
        success_msg: "PASS: additionalSecurityGroups are configured"
      when: expected_sgs | length == 0

    - ansible.builtin.set_fact:
        features_passed: "{{ features_passed | int + 1 }}"
  rescue:
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/verify_feature_rescue.yml"
      vars:
        feature_id: security_groups
        fail_detail: "additionalSecurityGroups not set or does not match expected"
