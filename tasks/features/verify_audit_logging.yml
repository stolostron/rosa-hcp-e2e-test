---
# Feature Check: Log Forwarding (via AWS CLI)

- name: Verify Log Forwarding
  vars:
    verify_region: "{{ aws_region | default(rcp.spec.region | default('us-west-2')) }}"
  block:
    - name: Assert at least one complete log destination is configured
      ansible.builtin.assert:
        that:
          - >-
            (log_forward_cloudwatch_role_arn is defined
             and log_forward_cloudwatch_role_arn | length > 0
             and log_forward_cloudwatch_log_group is defined
             and log_forward_cloudwatch_log_group | length > 0) or
            (log_forward_s3_bucket is defined
             and log_forward_s3_bucket | length > 0)
        fail_msg: >-
          FAIL: No complete log forwarding destination configured —
          provide both log_forward_cloudwatch_role_arn and
          log_forward_cloudwatch_log_group, or
          log_forward_s3_bucket
        success_msg: "PASS: Complete log destination configured"

    - name: Assert log forwarding is configured on ROSAControlPlane
      ansible.builtin.assert:
        that:
          - >-
            (rcp.spec.cloudWatchlogForwarder is defined and rcp.spec.cloudWatchlogForwarder | default({}) | length > 0) or
            (rcp.spec.s3LogForwarder is defined and rcp.spec.s3LogForwarder | default({}) | length > 0)
        fail_msg: "FAIL: No log forwarding destination configured on ROSAControlPlane"
        success_msg: "PASS: Log forwarding configured on ROSAControlPlane"

    - name: Assert CloudWatch forwarder in CRD matches requested inputs
      ansible.builtin.assert:
        that:
          - (rcp.spec.cloudWatchlogForwarder.cloudWatchLogRoleArn | default('')) == log_forward_cloudwatch_role_arn
          - (rcp.spec.cloudWatchlogForwarder.cloudWatchLogGroupName | default('')) == log_forward_cloudwatch_log_group
        fail_msg: "FAIL: CloudWatch forwarder in ROSAControlPlane does not match requested role ARN or log group"
        success_msg: "PASS: CloudWatch forwarder in ROSAControlPlane matches requested inputs"
      when:
        - log_forward_cloudwatch_role_arn is defined and log_forward_cloudwatch_role_arn | length > 0
        - log_forward_cloudwatch_log_group is defined and log_forward_cloudwatch_log_group | length > 0

    - name: Assert S3 forwarder in CRD matches requested inputs
      ansible.builtin.assert:
        that:
          - (rcp.spec.s3LogForwarder.s3ConfigBucketName | default('')) == log_forward_s3_bucket
        fail_msg: "FAIL: S3 forwarder in ROSAControlPlane does not match requested bucket"
        success_msg: "PASS: S3 forwarder in ROSAControlPlane matches requested bucket"
      when: log_forward_s3_bucket is defined and log_forward_s3_bucket | length > 0

    - name: Verify CloudWatch IAM role exists (boto3)
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import boto3, os
            iam = boto3.client('iam')
            import re
            m = re.search(r'role/(?:.*/)?(.+)$', os.environ['ROLE_ARN'])
            role_name = m.group(1) if m else os.environ['ROLE_ARN'].rsplit('/', 1)[-1]
            r = iam.get_role(RoleName=role_name)
            print(r['Role']['Arn'])
      environment:
        ROLE_ARN: "{{ log_forward_cloudwatch_role_arn }}"
      register: boto3_cw_role_check
      changed_when: false
      failed_when: false
      no_log: true
      when: boto3_check.rc == 0 and log_forward_cloudwatch_role_arn is defined and (log_forward_cloudwatch_role_arn | length > 0)

    - name: Assert CloudWatch IAM role exists
      ansible.builtin.assert:
        that:
          - boto3_cw_role_check.rc == 0
          - boto3_cw_role_check.stdout | trim == log_forward_cloudwatch_role_arn
        fail_msg: "FAIL: CloudWatch IAM role not found in AWS"
        success_msg: "PASS: CloudWatch IAM role exists"
      when: boto3_check.rc == 0 and log_forward_cloudwatch_role_arn is defined and (log_forward_cloudwatch_role_arn | length > 0)

    - name: Verify CloudWatch log group exists (boto3)
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import boto3, os
            logs = boto3.client('logs', region_name=os.environ['VERIFY_REGION'])
            group = os.environ['LOG_GROUP']
            r = logs.describe_log_groups(logGroupNamePrefix=group)
            matches = [g['logGroupName'] for g in r['logGroups'] if g['logGroupName'] == group]
            print(matches[0] if matches else '')
      environment:
        VERIFY_REGION: "{{ verify_region }}"
        LOG_GROUP: "{{ log_forward_cloudwatch_log_group }}"
      register: boto3_cw_log_group_check
      changed_when: false
      failed_when: false
      when: boto3_check.rc == 0 and log_forward_cloudwatch_log_group is defined and (log_forward_cloudwatch_log_group | length > 0)

    - name: Assert CloudWatch log group exists
      ansible.builtin.assert:
        that:
          - boto3_cw_log_group_check.rc == 0
          - boto3_cw_log_group_check.stdout | trim == log_forward_cloudwatch_log_group
        fail_msg: "FAIL: CloudWatch log group not found in the specified region"
        success_msg: "PASS: CloudWatch log group exists"
      when: boto3_check.rc == 0 and log_forward_cloudwatch_log_group is defined and (log_forward_cloudwatch_log_group | length > 0)

    - name: Verify S3 bucket exists (boto3)
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import boto3, os, sys
            from botocore.exceptions import ClientError
            s3 = boto3.client('s3')
            try:
                s3.head_bucket(Bucket=os.environ['BUCKET_NAME'])
                print('exists')
            except ClientError as e:
                code = str(e.response.get('Error', {}).get('Code', ''))
                if code in ('404', 'NoSuchBucket', 'NotFound'):
                    print('missing')
                    sys.exit(1)
                elif code in ('403', 'AccessDenied', 'Forbidden'):
                    print('unverified_auth')
                else:
                    print(f'unverified_{code}')
      environment:
        BUCKET_NAME: "{{ log_forward_s3_bucket }}"
      register: boto3_s3_bucket_check
      changed_when: false
      failed_when: false
      when: boto3_check.rc == 0 and log_forward_s3_bucket is defined and (log_forward_s3_bucket | length > 0)

    - name: Assert S3 bucket exists
      ansible.builtin.assert:
        that:
          - boto3_s3_bucket_check.rc == 0
          - boto3_s3_bucket_check.stdout | trim in ['exists', 'unverified_auth']
        fail_msg: "FAIL: S3 bucket '{{ log_forward_s3_bucket }}' lookup failed or not found in AWS (output: {{ boto3_s3_bucket_check.stdout | default('') | trim }}, stderr: {{ boto3_s3_bucket_check.stderr | default('') | trim }})"
        success_msg: "PASS: S3 bucket '{{ log_forward_s3_bucket }}' confirmed in AWS (status: {{ boto3_s3_bucket_check.stdout | trim }})"
      when: boto3_check.rc == 0 and log_forward_s3_bucket is defined and (log_forward_s3_bucket | length > 0)

    - ansible.builtin.set_fact:
        features_passed: "{{ features_passed | int + 1 }}"
  rescue:
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/verify_feature_rescue.yml"
      vars:
        feature_id: audit_logging
        fail_detail: "log forwarding destinations not found in AWS"
