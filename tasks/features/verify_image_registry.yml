---
# Feature Check: Image Registry Config (via OCM API)

- name: Verify Image Registry Config
  vars:
    expected_domain: "{{ registry_domain | default('quay.io') }}"
  block:
    - name: Assert registry config via OCM
      ansible.builtin.assert:
        that:
          - ocm_cluster.registry_config is defined
          - ocm_cluster.registry_config.allowed_registries_for_import is defined
          - ocm_cluster.registry_config.allowed_registries_for_import | length > 0
          - >-
            ocm_cluster.registry_config.allowed_registries_for_import
            | selectattr('domain_name', 'defined')
            | selectattr('domain_name', 'equalto', expected_domain)
            | list | length > 0
        fail_msg: "FAIL: OCM registry_config does not include expected domain"
        success_msg: "PASS: OCM confirms registry config includes expected domain"
      when: ocm_available

    - name: Assert clusterRegistryConfig via CRD (fallback)
      ansible.builtin.assert:
        that:
          - rcp.spec.clusterRegistryConfig is defined
          - rcp.spec.clusterRegistryConfig.allowedRegistriesForImport is defined
          - rcp.spec.clusterRegistryConfig.allowedRegistriesForImport | length > 0
          - rcp.spec.clusterRegistryConfig.registrySources is defined
          - rcp.spec.clusterRegistryConfig.registrySources.allowedRegistries is defined
          - expected_domain in (rcp.spec.clusterRegistryConfig.registrySources.allowedRegistries | default([]))
        fail_msg: "FAIL: clusterRegistryConfig does not include expected domain"
        success_msg: "PASS: clusterRegistryConfig includes expected domain (CRD fallback)"
      when: not ocm_available

    - ansible.builtin.set_fact:
        features_passed: "{{ features_passed | int + 1 }}"
  rescue:
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/verify_feature_rescue.yml"
      vars:
        feature_id: image_registry
        fail_detail: "registry config not set"
