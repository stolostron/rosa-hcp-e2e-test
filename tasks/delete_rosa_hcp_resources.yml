---
# ================================================================
# Delete ROSA HCP Resources Task File
# ================================================================
# This task file handles the deletion of ROSA HCP cluster resources
# in the correct order with proper error handling and waiting.
# ================================================================

- name: Set agent monitor log file for real-time monitoring
  set_fact:
    agent_monitor_log: "/tmp/deletion-agent-{{ cluster_name }}.log"

- name: Initialize agent monitor log file
  copy:
    content: ""
    dest: "{{ agent_monitor_log }}"
    force: true

- name: Check if Cluster exists
  shell: |
    oc get cluster {{ cluster_name }} -n {{ rosa_hcp_namespace }} -o name 2>/dev/null || echo "not-found"
  register: cluster_exists
  changed_when: false

- name: Check if ROSAControlPlane exists
  shell: |
    oc get rosacontrolplane {{ cluster_name }} -n {{ rosa_hcp_namespace }} -o name 2>/dev/null || echo "not-found"
  register: rcp_exists
  changed_when: false

- name: Check if ROSAMachinePool exists
  shell: |
    oc get rosamachinepool {{ machine_pool_name }} -n {{ rosa_hcp_namespace }} -o name 2>/dev/null || echo "not-found"
  register: rmp_exists
  changed_when: false

- name: Discover ROSANetwork by label or name
  shell: |
    COUNT=$(oc get rosanetwork -n {{ rosa_hcp_namespace }} \
      -l cluster.x-k8s.io/cluster-name={{ cluster_name }} \
      -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
      | grep -c . || echo "0")
    COUNT=${COUNT:-0}
    if [ "$COUNT" -gt 1 ]; then
      echo "WARNING: Found $COUNT ROSANetwork resources with label cluster.x-k8s.io/cluster-name={{ cluster_name }} — using first" >&2
    fi
    FOUND=$(oc get rosanetwork -n {{ rosa_hcp_namespace }} \
      -l cluster.x-k8s.io/cluster-name={{ cluster_name }} \
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
    if [ -z "$FOUND" ]; then
      FOUND=$(oc get rosanetwork {{ rosa_network_name }} -n {{ rosa_hcp_namespace }} \
        -o jsonpath='{.metadata.name}' 2>/dev/null)
    fi
    echo "${FOUND:-not-found}"
  register: rn_exists
  changed_when: false

- name: Set discovered ROSANetwork name
  set_fact:
    discovered_rosa_network_name: "{{ rn_exists.stdout | trim }}"

- name: Discover ROSARoleConfig by label or name
  shell: |
    COUNT=$(oc get rosaroleconfig -n {{ rosa_hcp_namespace }} \
      -l cluster.x-k8s.io/cluster-name={{ cluster_name }} \
      -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
      | grep -c . || echo "0")
    COUNT=${COUNT:-0}
    if [ "$COUNT" -gt 1 ]; then
      echo "WARNING: Found $COUNT ROSARoleConfig resources with label cluster.x-k8s.io/cluster-name={{ cluster_name }} — using first" >&2
    fi
    FOUND=$(oc get rosaroleconfig -n {{ rosa_hcp_namespace }} \
      -l cluster.x-k8s.io/cluster-name={{ cluster_name }} \
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
    if [ -z "$FOUND" ]; then
      FOUND=$(oc get rosaroleconfig {{ rosa_role_config_name }} -n {{ rosa_hcp_namespace }} \
        -o jsonpath='{.metadata.name}' 2>/dev/null)
    fi
    echo "${FOUND:-not-found}"
  register: rrc_exists
  changed_when: false

- name: Set discovered ROSARoleConfig name
  set_fact:
    discovered_rosa_role_config_name: "{{ rrc_exists.stdout | trim }}"

- name: Display resource status
  debug:
    msg: |
      Current Resource Status:
      • Cluster: {{ 'Found' if 'not-found' not in cluster_exists.stdout else 'Not Found' }}
      • ROSAControlPlane: {{ 'Found' if 'not-found' not in rcp_exists.stdout else 'Not Found' }}
      • ROSAMachinePool: {{ 'Found' if 'not-found' not in rmp_exists.stdout else 'Not Found' }}
      • ROSANetwork: {{ 'Found (' + discovered_rosa_network_name + ')' if discovered_rosa_network_name != 'not-found' else 'Not Found' }}
      • ROSARoleConfig: {{ 'Found (' + discovered_rosa_role_config_name + ')' if discovered_rosa_role_config_name != 'not-found' else 'Not Found' }}

- name: Build list of resources to delete
  set_fact:
    resources_to_delete: []

- name: Add cluster to deletion list (if exists)
  set_fact:
    resources_to_delete: "{{ resources_to_delete + ['cluster/' + cluster_name] }}"
  when: "'not-found' not in cluster_exists.stdout"

- name: Add ROSAControlPlane to deletion list (if exists)
  set_fact:
    resources_to_delete: "{{ resources_to_delete + ['rosacontrolplane/' + cluster_name] }}"
  when: "'not-found' not in rcp_exists.stdout"

- name: Display resources to be deleted
  debug:
    msg: |
      Resources to delete:
      {{ resources_to_delete | join('\n      ') }}
  when: resources_to_delete | length > 0

- name: Delete all ROSA resources with single oc delete command
  shell: |
    oc delete -n {{ rosa_hcp_namespace }} {{ resources_to_delete | join(' ') }} --wait=false
  register: delete_all
  when: resources_to_delete | length > 0

- name: Show deletion status
  debug:
    msg: "✓ Deletion initiated for {{ resources_to_delete | length }} resource(s)"
  when:
    - resources_to_delete | length > 0
    - delete_all.rc == 0

- name: No resources to delete
  debug:
    msg: "ℹ️  No matching resources found to delete"
  when: resources_to_delete | length == 0

- name: Emit agent context for ROSAControlPlane deletion wait
  shell: |
    echo "#AGENT_CONTEXT: resource_name={{ cluster_name }} namespace={{ rosa_hcp_namespace }} resource_type=rosacontrolplane" | tee -a "{{ agent_monitor_log }}"
  changed_when: false
  when:
    - wait_for_deletion | bool
    - "'not-found' not in rcp_exists.stdout"

- name: Wait for ROSAControlPlane deletion to complete
  shell: |
    LOGFILE="{{ agent_monitor_log }}"
    RETRIES={{ (rosacontrolplane_timeout | default(deletion_timeout) | int / 10) | int }}
    for i in $(seq 1 $RETRIES); do
      OUTPUT=$(oc get rosacontrolplane {{ cluster_name }} -n {{ rosa_hcp_namespace }} 2>&1)
      RC=$?
      if [ $RC -ne 0 ]; then
        if echo "$OUTPUT" | grep -qi "not found\|NotFound\|no resources found"; then
          echo "ROSAControlPlane deleted successfully" | tee -a "$LOGFILE"
          exit 0
        fi
        echo "WARNING: oc get failed unexpectedly (rc=$RC): $OUTPUT" | tee -a "$LOGFILE"
      fi
      echo "FAILED - RETRYING: [localhost]: Wait for rosacontrolplane {{ cluster_name }} deletion to complete ($((RETRIES - i)) retries left)." | tee -a "$LOGFILE"
      sleep 10
    done
    echo "Timed out waiting for ROSAControlPlane deletion" | tee -a "$LOGFILE"
    exit 1
  register: wait_rcp
  failed_when: false
  when:
    - wait_for_deletion | bool
    - "'not-found' not in rcp_exists.stdout"

- name: Final check - verify ROSAControlPlane is actually gone
  shell: |
    LOGFILE="{{ agent_monitor_log }}"
    for i in $(seq 1 18); do
      OUTPUT=$(oc get rosacontrolplane {{ cluster_name }} -n {{ rosa_hcp_namespace }} 2>&1)
      RC=$?
      if [ $RC -ne 0 ]; then
        if echo "$OUTPUT" | grep -qi "not found\|NotFound\|no resources found"; then
          echo "ROSAControlPlane confirmed deleted" | tee -a "$LOGFILE"
          exit 0
        fi
        echo "WARNING: oc get failed unexpectedly (rc=$RC): $OUTPUT" | tee -a "$LOGFILE"
      fi
      echo "FAILED - RETRYING: [localhost]: Final check rosacontrolplane {{ cluster_name }} deletion ($((18 - i)) retries left)." | tee -a "$LOGFILE"
      sleep 10
    done
    echo "ROSAControlPlane still exists after final check" | tee -a "$LOGFILE"
    exit 1
  register: final_rcp_check
  failed_when: false
  changed_when: false
  when:
    - wait_for_deletion | bool
    - "'not-found' not in rcp_exists.stdout"
    - wait_rcp.rc != 0

- name: Display ROSAControlPlane deletion result
  debug:
    msg: |
      {% if wait_rcp.rc == 0 or (final_rcp_check.rc | default(1)) == 0 %}
      ✅ ROSAControlPlane successfully deleted: {{ cluster_name }}
      {% else %}
      ⚠️  ROSAControlPlane still exists (may still be deleting): {{ cluster_name }}
      Check status: oc get rosacontrolplane {{ cluster_name }} -n {{ rosa_hcp_namespace }}
      {% endif %}
  when:
    - wait_for_deletion | bool
    - "'not-found' not in rcp_exists.stdout"

- name: Warn if ROSAControlPlane still exists after all retries
  set_fact:
    rcp_deletion_failed: true
  when:
    - wait_for_deletion | bool
    - "'not-found' not in rcp_exists.stdout"
    - wait_rcp.rc != 0
    - (final_rcp_check.rc | default(1)) != 0

- name: Display ROSAControlPlane timeout warning
  debug:
    msg: |
      ⚠️  ROSAControlPlane {{ cluster_name }} still exists after timeout.
      Continuing with remaining resource cleanup...
      Check: oc get rosacontrolplane {{ cluster_name }} -n {{ rosa_hcp_namespace }}
  when: rcp_deletion_failed | default(false) | bool

- name: Clean up additional security groups (before VPC deletion)
  include_tasks: delete_security_group.yml
  when:
    - (AWS_ACCESS_KEY_ID is defined and AWS_ACCESS_KEY_ID | length > 0 and AWS_SECRET_ACCESS_KEY is defined and AWS_SECRET_ACCESS_KEY | length > 0) or (lookup('env', 'AWS_ACCESS_KEY_ID') | length > 0 and lookup('env', 'AWS_SECRET_ACCESS_KEY') | length > 0)
    - (feature_security_groups_enabled | default(false) | bool) or (created_security_group_id is defined)

- name: Delete ROSANetwork (after ROSAControlPlane deletion completes)
  shell: |
    oc delete rosanetwork {{ discovered_rosa_network_name }} -n {{ rosa_hcp_namespace }} --wait=false
  register: delete_rn
  failed_when: false
  when:
    - delete_network | bool
    - discovered_rosa_network_name != 'not-found'

- name: Delete ManagedCluster (if exists)
  shell: |
    oc delete managedcluster {{ cluster_name }} --wait=false
  register: delete_mc
  failed_when: false
  ignore_errors: true
  when: deployment_mode != 'standalone'

- name: Emit agent context for ROSANetwork deletion wait
  shell: |
    echo "#AGENT_CONTEXT: resource_name={{ discovered_rosa_network_name }} namespace={{ rosa_hcp_namespace }} resource_type=rosanetwork" | tee -a "{{ agent_monitor_log }}"
  changed_when: false
  when:
    - wait_for_deletion | bool
    - delete_network | bool
    - discovered_rosa_network_name != 'not-found'

- name: Wait for ROSANetwork deletion to complete
  no_log: true
  environment:
    AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID | default(omit) }}"
    AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY | default(omit) }}"
  shell: |
    LOGFILE="{{ agent_monitor_log }}"
    STACK_NAME="{{ cluster_name }}-rosa-network-stack"
    REGION="{{ aws_region | default('us-west-2') }}"
    RETRIES={{ (rosanetwork_timeout | default(deletion_timeout) | int / 10) | int }}
    ITERATION_COUNT=0
    MAX_CF_RETRIES=3
    CF_RETRY_COUNT=0
    for i in $(seq 1 $RETRIES); do
      OUTPUT=$(oc get rosanetwork {{ discovered_rosa_network_name }} -n {{ rosa_hcp_namespace }} 2>&1)
      RC=$?
      if [ $RC -ne 0 ]; then
        if echo "$OUTPUT" | grep -qi "not found\|NotFound\|no resources found"; then
          echo "ROSANetwork deleted successfully" | tee -a "$LOGFILE"
          exit 0
        fi
        echo "WARNING: oc get failed unexpectedly (rc=$RC): $OUTPUT" | tee -a "$LOGFILE"
      fi

      ITERATION_COUNT=$((ITERATION_COUNT + 1))

      # Only check CloudFormation after 3 consecutive failures (avoid API overhead on every iteration)
      # and only up to MAX_CF_RETRIES times total (prevents infinite recovery loops)
      if [ "$ITERATION_COUNT" -ge 3 ] && [ "$CF_RETRY_COUNT" -lt "$MAX_CF_RETRIES" ]; then
        CF_STATUS=$(aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" --region "$REGION" \
          --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "GONE")
        ITERATION_COUNT=0  # reset after every CF check so next check waits another 3 iterations

        if [ "$CF_STATUS" = "DELETE_FAILED" ]; then
          echo "#AGENT_CONTEXT: cf_status=DELETE_FAILED stack_name=$STACK_NAME resource_type=rosanetwork" | tee -a "$LOGFILE"
          echo "CloudFormation stack $STACK_NAME is DELETE_FAILED — attempting force cleanup" | tee -a "$LOGFILE"

          # Get VPC ID from stack
          VPC_ID=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" --region "$REGION" \
            --logical-resource-id VPC \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text 2>/dev/null)

          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            # Safety: VPC_ID comes from the CloudFormation stack's own VPC logical resource,
            # so it is dedicated to this cluster. BYON-VPC clusters have no VPC logical resource
            # in their stack, so describe-stack-resource fails and VPC_ID is empty — the
            # [ -n "$VPC_ID" ] guard above prevents cleanup on shared VPCs.
            #
            # NOTE: This VPC cleanup logic is also implemented in agents/remediation_agent.py
            # (_fix_retry_cloudformation_delete). Keep both in sync when adding new resource types.
            # The agent additionally handles subnets and internet gateways (TODO: add those here).
            # The agent path is a concurrent secondary recovery; see PR #135 for architecture notes.
            echo "Cleaning up VPC $VPC_ID dependencies" | tee -a "$LOGFILE"
            CLEANUP_ERRORS=0

            # Delete VPC endpoints first (create ela-attach ENIs that block deletion)
            VPCE_IDS=$(aws ec2 describe-vpc-endpoints \
              --region "$REGION" \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=vpc-endpoint-state,Values=available,pending,deleting" \
              --query 'VpcEndpoints[*].VpcEndpointId' --output text 2>/dev/null)
            VPCE_IDS=$(echo $VPCE_IDS)  # normalize tab-separated output to spaces
            if [ -n "$VPCE_IDS" ]; then
              echo "Deleting VPC endpoints: $VPCE_IDS" | tee -a "$LOGFILE"
              aws ec2 delete-vpc-endpoints --region "$REGION" --vpc-endpoint-ids $VPCE_IDS 2>&1 | tee -a "$LOGFILE" || { CLEANUP_ERRORS=$((CLEANUP_ERRORS + 1)); true; }
              sleep 20
            fi

            # Delete orphaned ENIs — detach first to handle attached interfaces
            ENI_IDS=$(aws ec2 describe-network-interfaces \
              --region "$REGION" \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'NetworkInterfaces[*].NetworkInterfaceId' --output text 2>/dev/null)
            for ENI_ID in $ENI_IDS; do
              ATTACH_ID=$(aws ec2 describe-network-interfaces \
                --region "$REGION" \
                --network-interface-ids "$ENI_ID" \
                --query 'NetworkInterfaces[0].Attachment.AttachmentId' --output text 2>/dev/null)
              if [ -n "$ATTACH_ID" ] && [ "$ATTACH_ID" != "None" ]; then
                aws ec2 detach-network-interface --region "$REGION" \
                  --attachment-id "$ATTACH_ID" --force 2>&1 | tee -a "$LOGFILE" || { CLEANUP_ERRORS=$((CLEANUP_ERRORS + 1)); true; }
                sleep 5
              fi
              aws ec2 delete-network-interface --region "$REGION" --network-interface-id "$ENI_ID" 2>&1 | tee -a "$LOGFILE" || { CLEANUP_ERRORS=$((CLEANUP_ERRORS + 1)); true; }
            done

            # Delete non-default security groups
            SG_IDS=$(aws ec2 describe-security-groups \
              --region "$REGION" \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null)
            for SG_ID in $SG_IDS; do
              aws ec2 delete-security-group --region "$REGION" --group-id "$SG_ID" 2>&1 | tee -a "$LOGFILE" || { CLEANUP_ERRORS=$((CLEANUP_ERRORS + 1)); true; }
            done

            # Log summary of VPC cleanup results
            echo "CF recovery VPC cleanup: $CLEANUP_ERRORS error(s) during resource deletion" | tee -a "$LOGFILE"
          fi

          # Retry the CloudFormation stack deletion
          echo "Retrying CloudFormation stack deletion: $STACK_NAME" | tee -a "$LOGFILE"
          aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$REGION" 2>&1 | tee -a "$LOGFILE" || true
          CF_RETRY_COUNT=$((CF_RETRY_COUNT + 1))
          if [ "$CF_RETRY_COUNT" -ge "$MAX_CF_RETRIES" ]; then
            echo "WARNING: CF recovery attempted $CF_RETRY_COUNT/$MAX_CF_RETRIES times — further attempts suppressed" | tee -a "$LOGFILE"
          fi
          sleep 15
        fi
      fi

      echo "FAILED - RETRYING: [localhost]: Wait for rosanetwork {{ discovered_rosa_network_name }} deletion to complete ($((RETRIES - i)) retries left)." | tee -a "$LOGFILE"
      sleep 10
    done
    echo "Timed out waiting for ROSANetwork deletion" | tee -a "$LOGFILE"
    exit 1
  register: wait_rn
  failed_when: false
  when:
    - wait_for_deletion | bool
    - delete_network | bool
    - discovered_rosa_network_name != 'not-found'

- name: Final check - verify ROSANetwork is actually gone
  shell: |
    LOGFILE="{{ agent_monitor_log }}"
    for i in $(seq 1 36); do
      OUTPUT=$(oc get rosanetwork {{ discovered_rosa_network_name }} -n {{ rosa_hcp_namespace }} 2>&1)
      RC=$?
      if [ $RC -ne 0 ]; then
        if echo "$OUTPUT" | grep -qi "not found\|NotFound\|no resources found"; then
          echo "ROSANetwork confirmed deleted" | tee -a "$LOGFILE"
          exit 0
        fi
        echo "WARNING: oc get failed unexpectedly (rc=$RC): $OUTPUT" | tee -a "$LOGFILE"
      fi
      echo "FAILED - RETRYING: [localhost]: Final check rosanetwork {{ discovered_rosa_network_name }} deletion ($((36 - i)) retries left)." | tee -a "$LOGFILE"
      sleep 10
    done
    echo "ROSANetwork still exists after final check" | tee -a "$LOGFILE"
    exit 1
  register: final_rn_check
  failed_when: false
  changed_when: false
  when:
    - wait_for_deletion | bool
    - delete_network | bool
    - discovered_rosa_network_name != 'not-found'
    - wait_rn.rc != 0

- name: Display ROSANetwork deletion result
  debug:
    msg: |
      {% if wait_rn.rc == 0 or (final_rn_check.rc | default(1)) == 0 %}
      ✅ ROSANetwork successfully deleted: {{ discovered_rosa_network_name }}
      {% else %}
      ⚠️  ROSANetwork still exists (CloudFormation stack may still be deleting)
      Check status: oc get rosanetwork {{ discovered_rosa_network_name }} -n {{ rosa_hcp_namespace }}
      {% endif %}
  when:
    - wait_for_deletion | bool
    - delete_network | bool
    - discovered_rosa_network_name != 'not-found'

- name: Warn if ROSANetwork still exists after all retries
  set_fact:
    rosanetwork_deletion_failed: true
  when:
    - wait_for_deletion | bool
    - delete_network | bool
    - discovered_rosa_network_name != 'not-found'
    - wait_rn.rc != 0
    - (final_rn_check.rc | default(1)) != 0

- name: Display ROSANetwork timeout warning
  debug:
    msg: |
      ⚠️  ROSANetwork {{ discovered_rosa_network_name }} still exists after timeout.
      Continuing with remaining resource cleanup...
      CloudFormation stack may need manual cleanup.
      Check: python3 -c "import boto3; print(boto3.client('cloudformation', region_name='{{ aws_region | default('us-west-2') }}').describe_stacks(StackName='{{ cluster_name }}-rosa-network-stack'))"
  when: rosanetwork_deletion_failed | default(false) | bool

# ================================================================
# Post-deletion CloudFormation stack verification
# ================================================================
# After the K8s ROSANetwork resource is gone, the underlying AWS
# CloudFormation stack may still be DELETE_IN_PROGRESS or DELETE_FAILED.
# ROSA creates security groups (e.g. *-vpce-private-router) outside
# CloudFormation, which block VPC deletion and cause DELETE_FAILED.
# This step catches orphaned stacks that would otherwise cost money.
# ================================================================

- name: Emit agent context for CloudFormation verification
  shell: |
    echo "#AGENT_CONTEXT: resource_name={{ discovered_rosa_network_name }} namespace={{ rosa_hcp_namespace }} resource_type=rosanetwork" | tee -a "{{ agent_monitor_log }}"
  changed_when: false
  when:
    - wait_for_deletion | bool
    - delete_network | bool
    - discovered_rosa_network_name != 'not-found'

# This task is a final confirmation check that runs after the inline CF recovery
# in the "Wait for ROSANetwork deletion" task above. If the inline recovery succeeded,
# this task confirms the stack is gone. If the inline recovery hit MAX_CF_RETRIES or
# failed silently, this task detects DELETE_FAILED and logs it for operator attention.
# It does not perform cleanup — the inline recovery is the active recovery mechanism.
- name: Verify CloudFormation stack cleanup after ROSANetwork deletion
  no_log: true
  environment:
    AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID | default(omit) }}"
    AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY | default(omit) }}"
  shell: |
    LOGFILE="{{ agent_monitor_log }}"
    STACK_NAME="{{ cluster_name }}-rosa-network-stack"
    REGION="{{ aws_region | default('us-west-2') }}"
    NETWORK_NAME="{{ discovered_rosa_network_name }}"
    NAMESPACE="{{ rosa_hcp_namespace }}"
    RETRIES=36
    echo "Verifying CloudFormation stack $STACK_NAME cleanup..." | tee -a "$LOGFILE"
    for i in $(seq 1 $RETRIES); do
      # Try K8s resource status first (no boto3/AWS dependency)
      K8S_STATUS=$(oc get rosanetwork "$NETWORK_NAME" -n "$NAMESPACE" -o jsonpath='{.status.stackStatus}' 2>/dev/null)
      if [ -n "$K8S_STATUS" ]; then
        STATUS="$K8S_STATUS"
      else
        # K8s resource gone — try boto3 as fallback
        STATUS=$(python3 "{{ playbook_dir }}/../scripts/check_cfn_stack_status.py" "$STACK_NAME" "$REGION" 2>&1)
        RC=$?
        if [ $RC -eq 2 ]; then
          echo "WARNING: boto3 not available and K8s resource gone — cannot verify CloudFormation cleanup" | tee -a "$LOGFILE"
          echo "Install boto3: pip install boto3" | tee -a "$LOGFILE"
          exit 1
        fi
        if [ $RC -ne 0 ]; then
          if echo "$STATUS" | grep -qi "GONE"; then
            echo "CloudFormation stack $STACK_NAME confirmed deleted" | tee -a "$LOGFILE"
            exit 0
          fi
          echo "WARNING: CloudFormation check failed (rc=$RC): $STATUS" | tee -a "$LOGFILE"
        fi
        if [ "$STATUS" = "GONE" ]; then
          echo "CloudFormation stack $STACK_NAME confirmed deleted" | tee -a "$LOGFILE"
          exit 0
        fi
      fi
      if [ "$STATUS" = "DELETE_COMPLETE" ]; then
        echo "CloudFormation stack $STACK_NAME confirmed deleted" | tee -a "$LOGFILE"
        exit 0
      fi
      if [ "$STATUS" = "DELETE_FAILED" ]; then
        echo "CloudFormation stack DELETE_FAILED: $STACK_NAME — orphaned AWS resources detected" | tee -a "$LOGFILE"
        echo "FAILED - RETRYING: [localhost]: Wait for cloudformation $STACK_NAME deletion to complete ($((RETRIES - i)) retries left)." | tee -a "$LOGFILE"
        sleep 10
        continue
      fi
      echo "FAILED - RETRYING: [localhost]: Wait for cloudformation $STACK_NAME deletion to complete ($((RETRIES - i)) retries left). Status: $STATUS" | tee -a "$LOGFILE"
      sleep 10
    done
    echo "WARNING: CloudFormation stack $STACK_NAME not confirmed deleted after verification" | tee -a "$LOGFILE"
    exit 1
  register: cfn_verify
  failed_when: false
  when:
    - wait_for_deletion | bool
    - delete_network | bool
    - discovered_rosa_network_name != 'not-found'

- name: Display CloudFormation verification result
  debug:
    msg: |
      {% if cfn_verify.rc == 0 %}
      ✅ CloudFormation stack {{ cluster_name }}-rosa-network-stack confirmed deleted
      {% else %}
      ⚠️  CloudFormation stack {{ cluster_name }}-rosa-network-stack may have orphaned resources
      Check: python3 -c "import boto3; print(boto3.client('cloudformation', region_name='{{ aws_region | default('us-west-2') }}').describe_stacks(StackName='{{ cluster_name }}-rosa-network-stack'))"
      {% endif %}
  when:
    - wait_for_deletion | bool
    - delete_network | bool
    - discovered_rosa_network_name != 'not-found'
    - cfn_verify is defined

- name: Delete ROSARoleConfig (after ROSANetwork deletion completes)
  shell: |
    oc delete rosaroleconfig {{ discovered_rosa_role_config_name }} -n {{ rosa_hcp_namespace }} --wait=false
  register: delete_rrc
  failed_when: false
  when:
    - delete_roles | bool
    - discovered_rosa_role_config_name != 'not-found'

- name: Emit agent context for ROSARoleConfig deletion wait
  shell: |
    echo "#AGENT_CONTEXT: resource_name={{ discovered_rosa_role_config_name }} namespace={{ rosa_hcp_namespace }} resource_type=rosaroleconfig" | tee -a "{{ agent_monitor_log }}"
  changed_when: false
  when:
    - wait_for_deletion | bool
    - delete_roles | bool
    - discovered_rosa_role_config_name != 'not-found'

- name: Wait for ROSARoleConfig deletion to complete
  shell: |
    LOGFILE="{{ agent_monitor_log }}"
    RETRIES={{ (rosaroleconfig_timeout | default(deletion_timeout) | int / 10) | int }}
    for i in $(seq 1 $RETRIES); do
      OUTPUT=$(oc get rosaroleconfig {{ discovered_rosa_role_config_name }} -n {{ rosa_hcp_namespace }} 2>&1)
      RC=$?
      if [ $RC -ne 0 ]; then
        if echo "$OUTPUT" | grep -qi "not found\|NotFound\|no resources found"; then
          echo "ROSARoleConfig deleted successfully" | tee -a "$LOGFILE"
          exit 0
        fi
        echo "WARNING: oc get failed unexpectedly (rc=$RC): $OUTPUT" | tee -a "$LOGFILE"
      fi
      echo "FAILED - RETRYING: [localhost]: Wait for rosaroleconfig {{ discovered_rosa_role_config_name }} deletion to complete ($((RETRIES - i)) retries left)." | tee -a "$LOGFILE"
      sleep 10
    done
    echo "Timed out waiting for ROSARoleConfig deletion" | tee -a "$LOGFILE"
    exit 1
  register: wait_rrc
  failed_when: false
  when:
    - wait_for_deletion | bool
    - delete_roles | bool
    - discovered_rosa_role_config_name != 'not-found'

- name: Final check - verify ROSARoleConfig is actually gone
  shell: |
    LOGFILE="{{ agent_monitor_log }}"
    for i in $(seq 1 18); do
      OUTPUT=$(oc get rosaroleconfig {{ discovered_rosa_role_config_name }} -n {{ rosa_hcp_namespace }} 2>&1)
      RC=$?
      if [ $RC -ne 0 ]; then
        if echo "$OUTPUT" | grep -qi "not found\|NotFound\|no resources found"; then
          echo "ROSARoleConfig confirmed deleted" | tee -a "$LOGFILE"
          exit 0
        fi
        echo "WARNING: oc get failed unexpectedly (rc=$RC): $OUTPUT" | tee -a "$LOGFILE"
      fi
      echo "FAILED - RETRYING: [localhost]: Final check rosaroleconfig {{ discovered_rosa_role_config_name }} deletion ($((18 - i)) retries left)." | tee -a "$LOGFILE"
      sleep 10
    done
    echo "ROSARoleConfig still exists after final check" | tee -a "$LOGFILE"
    exit 1
  register: final_rrc_check
  failed_when: false
  changed_when: false
  when:
    - wait_for_deletion | bool
    - delete_roles | bool
    - discovered_rosa_role_config_name != 'not-found'
    - wait_rrc.rc != 0

- name: Display ROSARoleConfig deletion result
  debug:
    msg: |
      {% if wait_rrc.rc == 0 or (final_rrc_check.rc | default(1)) == 0 %}
      ✅ ROSARoleConfig successfully deleted: {{ discovered_rosa_role_config_name }}
      {% else %}
      ⚠️  ROSARoleConfig still exists (IAM roles may still be deleting)
      Check status: oc get rosaroleconfig {{ discovered_rosa_role_config_name }} -n {{ rosa_hcp_namespace }}
      {% endif %}
  when:
    - wait_for_deletion | bool
    - delete_roles | bool
    - discovered_rosa_role_config_name != 'not-found'

- name: Set deletion summary
  set_fact:
    deletion_summary: |
      {% if 'not-found' not in cluster_exists.stdout %}
      • Core Cluster: {{ '✅ Deleted' if delete_all is defined and delete_all.rc == 0 else '⏳ Deletion initiated' }}
      {% endif %}
      {% if 'not-found' not in rcp_exists.stdout %}
      • ROSAControlPlane: {{ '✅ Deleted' if (wait_for_deletion and (wait_rcp.rc == 0 or (final_rcp_check.rc | default(1)) == 0)) else '⏳ Deletion initiated' }}
      {% endif %}
      {% if 'not-found' not in rmp_exists.stdout %}
      • ROSAMachinePool: ✅ Auto-deleted (cascade)
      {% endif %}
      {% if delete_network | bool and discovered_rosa_network_name != 'not-found' %}
      • ROSANetwork: {{ '✅ Deleted' if (wait_for_deletion and (wait_rn.rc == 0 or (final_rn_check.rc | default(1)) == 0)) else '⏳ Deletion initiated' }}
      {% endif %}
      {% if delete_roles | bool and discovered_rosa_role_config_name != 'not-found' %}
      • ROSARoleConfig: {{ '✅ Deleted' if (wait_for_deletion and (wait_rrc.rc == 0 or (final_rrc_check.rc | default(1)) == 0)) else '⏳ Deletion initiated' }}
      {% endif %}

- name: Display deletion summary
  debug:
    msg: |

      Deletion Summary:
      {{ deletion_summary }}

- name: Fail if any resource deletion timed out
  fail:
    msg: |
      One or more resources failed to delete within the timeout period.
      {{ '⚠️  ROSAControlPlane timed out' if (rcp_deletion_failed | default(false)) else '' }}
      {{ '⚠️  ROSANetwork timed out' if (rosanetwork_deletion_failed | default(false)) else '' }}
  when: (rcp_deletion_failed | default(false)) or (rosanetwork_deletion_failed | default(false))
