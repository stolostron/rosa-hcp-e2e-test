---
# CAPI and HyperShift are mutually exclusive - disable CAPI components first
- name: Set component to cluster-api
  ansible.builtin.set_fact:
    component: "cluster-api"

- name: Disable cluster-api
  ansible.builtin.include_tasks: "{{ AUTOMATION_PATH }}/tasks/update_enabled_flag.yml"
  vars:
    enable: "false"

- name: Set component to cluster-api-provider-aws
  ansible.builtin.set_fact:
    component: "cluster-api-provider-aws"

- name: Disable cluster-api-provider-aws
  ansible.builtin.include_tasks: "{{ AUTOMATION_PATH }}/tasks/update_enabled_flag.yml"
  vars:
    enable: "false"

# Now enable HyperShift components
- name: Set component to hypershift
  ansible.builtin.set_fact:
    component: "hypershift"

- name: Get status for {{ component }}
  ansible.builtin.include_tasks: "{{ AUTOMATION_PATH }}/tasks/get_mce_component_status.yml"

- name: Enable hypershift
  ansible.builtin.include_tasks: "{{ AUTOMATION_PATH }}/tasks/update_enabled_flag.yml"
  vars:
    enable: "true"
  when: not component_enabled.stdout | bool

- name: Set component to hypershift-local-hosting
  ansible.builtin.set_fact:
    component: "hypershift-local-hosting"

- name: Get status for {{ component }}
  ansible.builtin.include_tasks: "{{ AUTOMATION_PATH }}/tasks/get_mce_component_status.yml"

- name: Enable hypershift-local-hosting
  ansible.builtin.include_tasks: "{{ AUTOMATION_PATH }}/tasks/update_enabled_flag.yml"
  vars:
    enable: "true"
  when: not component_enabled.stdout | bool
