- name: Show RCP version context
  ansible.builtin.debug:
    msg: >-
      rcp_name={{ rcp_name }}, current_version={{ current_version }},
      requested_version={{ requested_version }}

- name: Print version stuff
  debug:
    msg: "The rcp name is: {{ rcp_name }}. The current_version is {{ current_version }}. The requested_version is {{ requested_version }}. "

- name: Call oc to patch RCP
  shell: |
    oc patch rosacontrolplane --type=merge "{{ rcp_name }}" -n "ns-rosa-hcp" -p '{"spec": {"version": "{{ requested_version }}", "versionGate": "Acknowledge"}}'
  register: result

- name: Print result
  debug:
    msg: "result: {{ result.stdout }}"
