---
- name: Verify feature flags on provisioned ROSA HCP cluster
  hosts: localhost
  gather_facts: false
  environment:
    AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID | default(lookup('env', 'AWS_ACCESS_KEY_ID'), true) }}"
    AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY | default(lookup('env', 'AWS_SECRET_ACCESS_KEY'), true) }}"
    AWS_SESSION_TOKEN: "{{ AWS_SESSION_TOKEN | default(lookup('env', 'AWS_SESSION_TOKEN'), true) }}"
    AWS_DEFAULT_REGION: "{{ aws_region | default(lookup('env', 'AWS_DEFAULT_REGION'), true) | default('us-west-2', true) }}"
  vars_files:
    - ../vars/vars.yml
  vars:
    rosa_hcp_namespace: "{{ rosa_hcp_namespace | default('ns-rosa-hcp') }}"
    # Where the machine-readable results land. The runner archives a dated copy.
    feature_verification_dir: "{{ playbook_dir }}/../test-results"
    features_passed: 0
    features_failed: 0
    features_warned: 0
    results_passed: []
    results_failed: []
    results_warned: []
    crd_field_map:
      no_cni: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "network.networkType"}
      byon: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "subnets"}
      private_network: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "endpointAccess"}
      external_oidc: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "enableExternalAuthProviders"}
      fips: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "fips"}
      etcd_kms: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "etcdEncryptionKMSARN"}
      cluster_autoscaler_expander: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "autoscaler"}
      image_registry: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "clusterRegistryConfig"}
      disk_size: {crd: "rosamachinepools.infrastructure.cluster.x-k8s.io", field: "volumeSize"}
      parallel_upgrade: {crd: "rosamachinepools.infrastructure.cluster.x-k8s.io", field: "updateConfig"}
      security_groups: {crd: "rosamachinepools.infrastructure.cluster.x-k8s.io", field: "additionalSecurityGroups"}
      audit_logging: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "cloudWatchlogForwarder"}
      proxy_enabled: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "proxy"}
      default_autoscaling: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "defaultMachinePoolSpec"}
      domain_prefix: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "domainPrefix"}
      channel_group: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "channelGroup"}
      additional_tags: {crd: "rosacontrolplanes.controlplane.cluster.x-k8s.io", field: "additionalTags"}
      availability_zones: {crd: "rosanetworks.infrastructure.cluster.x-k8s.io", field: "availabilityZones"}

  tasks:
    # ================================================================
    # SETUP: Login and get cluster resources
    # ================================================================
    - name: Setup feature verification context
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/setup_feature_verification.yml"

    # ================================================================
    # FEATURE CHECKS
    # ================================================================
    - name: "CHECK: No CNI Plugin"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_no_cni.yml"
      when: "'no_cni' in requested_features_list"

    - name: "CHECK: Private Cluster"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_private_network.yml"
      when: "'private_network' in requested_features_list"

    - name: "CHECK: Bring Your Own Network"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_byon.yml"
      when: "'byon' in requested_features_list"

    - name: "CHECK: External OIDC"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_external_oidc.yml"
      when: "'external_oidc' in requested_features_list"

    - name: "CHECK: FIPS Mode"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_fips.yml"
      when: "'fips' in requested_features_list"

    - name: "CHECK: ETCD KMS Encryption"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_etcd_kms.yml"
      when: "'etcd_kms' in requested_features_list"

    - name: "CHECK: Cluster Autoscaler Expander"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_cluster_autoscaler_expander.yml"
      when: "'cluster_autoscaler_expander' in requested_features_list"

    - name: "CHECK: Image Registry Config"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_image_registry.yml"
      when: "'image_registry' in requested_features_list"

    - name: "CHECK: Additional Tags"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_additional_tags.yml"
      when: "'additional_tags' in requested_features_list"

    - name: "CHECK: Domain Prefix"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_domain_prefix.yml"
      when: "'domain_prefix' in requested_features_list"

    - name: "CHECK: Channel Group"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_channel_group.yml"
      when: "'channel_group' in requested_features_list"

    - name: "CHECK: Default MachinePool Autoscaling"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_default_autoscaling.yml"
      when: "'default_autoscaling' in requested_features_list"

    - name: "CHECK: Long Cluster Name"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_long_cluster_name.yml"

    - name: "CHECK: Disk Volume Size"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_disk_size.yml"
      when: "'disk_size' in requested_features_list"

    - name: "CHECK: Parallel Node Upgrade"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_parallel_upgrade.yml"
      when: "'parallel_upgrade' in requested_features_list"

    - name: "CHECK: Additional Security Groups"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_security_groups.yml"
      when: "'security_groups' in requested_features_list"

    - name: "CHECK: Availability Zones"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_availability_zones.yml"
      when: "'availability_zones' in requested_features_list"

    - name: "CHECK: Log Forwarding"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_audit_logging.yml"
      when: "'audit_logging' in requested_features_list"

    - name: "CHECK: Proxy Configuration"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/verify_proxy_enabled.yml"
      when: "'proxy_enabled' in requested_features_list"

    # ================================================================
    # SUMMARY & MACHINE-READABLE RESULTS
    # ================================================================
    - name: Report verification results
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/features/report_feature_verification.yml"
