      vars:
        expected_volume_size: "{{ root_volume_size | default(300) | int }}"
      block:
        - name: Query OCM node pools for volume size
          uri:
            url: "{{ ocm_api_url }}/api/clusters_mgmt/v1/clusters/{{ ocm_cluster.id }}/node_pools"
            method: GET
            headers:
              Authorization: "Bearer {{ ocm_token_result.json.access_token }}"
              Accept: application/json
            status_code: 200
            timeout: 15
          register: ocm_disk_node_pools
          failed_when: false
          changed_when: false
          no_log: true
          when: ocm_available and ocm_cluster.id is defined

        - name: Assert volumeSize via CRD
          assert:
            that:
              - rmp.spec.volumeSize is defined
              - rmp.spec.volumeSize | int == expected_volume_size | int
            fail_msg: "FAIL: CRD volumeSize {{ rmp.spec.volumeSize | default('undefined') }} does not match expected {{ expected_volume_size }}"
            success_msg: "PASS: CRD volumeSize matches expected {{ expected_volume_size }}"

        - name: Cross-check volume size via OCM node pool (if available)
          assert:
            that:
              - ocm_disk_node_pools.json.items | length > 0
              - ocm_disk_node_pools.json.items[0].root_volume is defined
              - ocm_disk_node_pools.json.items[0].root_volume | length > 0
            success_msg: "PASS: OCM node pool root_volume data available for cross-check"
          when: ocm_available and ocm_disk_node_pools is defined and ocm_disk_node_pools.json is defined
          ignore_errors: true

        - set_fact:
            features_passed: "{{ features_passed | int + 1 }}"
      rescue:
        - include_tasks: "{{ playbook_dir }}/../tasks/verify_feature_rescue.yml"
          vars:
            feature_id: disk_size
            fail_detail: "volume size does not match expected"

    # --- parallel_upgrade ---
    - name: "CHECK: Parallel Node Upgrade (via OCM API)"
      when: "'parallel_upgrade' in requested_features_list"
      vars:
        expected_max_surge: "{{ max_surge | default(1) | int }}"
        expected_max_unavailable: "{{ max_unavailable | default(0) | int }}"
      block:
        - name: Query OCM node pools for upgrade config
          uri:
            url: "{{ ocm_api_url }}/api/clusters_mgmt/v1/clusters/{{ ocm_cluster.id }}/node_pools"
            method: GET
            headers:
              Authorization: "Bearer {{ ocm_token_result.json.access_token }}"
              Accept: application/json
            status_code: 200
            timeout: 15
          register: ocm_node_pools_result
          failed_when: false
          changed_when: false
          no_log: true
          when: ocm_available and ocm_cluster.id is defined

        - name: Assert node pool upgrade config via OCM
          assert:
            that:
              - ocm_node_pools_result.json.items | length > 0
              - ocm_node_pools_result.json.items[0].management_upgrade is defined
              - ocm_node_pools_result.json.items[0].management_upgrade.max_surge is defined
              - >-
                ocm_node_pools_result.json.items[0].management_upgrade.max_surge
                | string == expected_max_surge | string
              - >-
                ocm_node_pools_result.json.items[0].management_upgrade.max_unavailable
                | default(0) | string == expected_max_unavailable | string
            fail_msg: >-
              FAIL: OCM node pool upgrade config does not match expected
              maxSurge={{ expected_max_surge }}
              maxUnavailable={{ expected_max_unavailable }}
            success_msg: >-
              PASS: OCM node pool upgrade config matches expected
          when: ocm_available and ocm_node_pools_result is defined and ocm_node_pools_result.json is defined

        - name: Assert updateConfig via CRD (fallback)
          assert:
            that:
              - rmp.spec.updateConfig is defined
              - rmp.spec.updateConfig.rollingUpdate is defined
              - rmp.spec.updateConfig.rollingUpdate.maxSurge | int == expected_max_surge | int
              - rmp.spec.updateConfig.rollingUpdate.maxUnavailable | int == expected_max_unavailable | int
            fail_msg: "FAIL: rollingUpdate does not match expected"
            success_msg: "PASS: rollingUpdate matches expected (CRD fallback)"
          when: not ocm_available or ocm_node_pools_result is not defined or ocm_node_pools_result.json is not defined

        - set_fact:
            features_passed: "{{ features_passed | int + 1 }}"
      rescue:
        - include_tasks: "{{ playbook_dir }}/../tasks/verify_feature_rescue.yml"
          vars:
            feature_id: parallel_upgrade
            fail_detail: "node pool upgrade config not set"

    # --- security_groups ---
    - name: "CHECK: Additional Security Groups"
      when: "'security_groups' in requested_features_list"
      vars:
        expected_sgs: "{{ additional_security_groups | default([]) }}"
      block:
        - name: Assert additionalSecurityGroups match requested
          assert:
            that:
              - rmp.spec.additionalSecurityGroups is defined
              - rmp.spec.additionalSecurityGroups | length > 0
              - rmp.spec.additionalSecurityGroups | sort == expected_sgs | sort
            fail_msg: "FAIL: additionalSecurityGroups do not match expected"
            success_msg: "PASS: additionalSecurityGroups match requested"
          when: expected_sgs | length > 0
        - name: Assert additionalSecurityGroups exists (no expected list to compare)
          assert:
            that:
              - rmp.spec.additionalSecurityGroups is defined
              - rmp.spec.additionalSecurityGroups | length > 0
            fail_msg: "FAIL: additionalSecurityGroups not set"
            success_msg: "PASS: additionalSecurityGroups are configured"
          when: expected_sgs | length == 0
        - set_fact:
            features_passed: "{{ features_passed | int + 1 }}"
      rescue:
        - include_tasks: "{{ playbook_dir }}/../tasks/verify_feature_rescue.yml"
          vars:
            feature_id: security_groups
            fail_detail: "additionalSecurityGroups not set or does not match expected"

    # --- availability_zones ---
    - name: "CHECK: Availability Zones (via OCM API + CRD)"
      when: "'availability_zones' in requested_features_list"
      vars:
        expected_az_count: "{{ availability_zone_count | default(2) | int }}"
      block:
        - name: Assert availability zones via OCM
          assert:
            that:
              - ocm_cluster.nodes.availability_zones is defined
              - ocm_cluster.nodes.availability_zones | length | int == expected_az_count | int
            fail_msg: "FAIL: OCM reports {{ ocm_cluster.nodes.availability_zones | default([]) | length }} AZs, expected {{ expected_az_count }}"
            success_msg: "PASS: OCM confirms {{ expected_az_count }} availability zones"
          when: ocm_available

        - name: Assert availability zones via ROSANetwork CRD
          assert:
            that:
              - rnet is defined
              - rnet.spec.availabilityZones is defined
              - rnet.spec.availabilityZones | length | int == expected_az_count | int
            fail_msg: "FAIL: ROSANetwork has {{ rnet.spec.availabilityZones | default([]) | length }} AZs, expected {{ expected_az_count }}"
            success_msg: "PASS: ROSANetwork CRD confirms {{ expected_az_count }} availability zones"
          when: rnet is defined

        - name: Assert availability zones via ROSANetwork status subnets
          assert:
            that:
              - rnet is defined
              - rnet.status.subnets is defined
              - rnet.status.subnets | length | int == expected_az_count | int
            fail_msg: "FAIL: ROSANetwork status shows {{ rnet.status.subnets | default([]) | length }} subnet pairs, expected {{ expected_az_count }}"
            success_msg: "PASS: ROSANetwork status confirms {{ expected_az_count }} subnet pairs"
          when: rnet is defined and rnet.status is defined and rnet.status.subnets is defined

        - set_fact:
            features_passed: "{{ features_passed | int + 1 }}"
      rescue:
        - include_tasks: "{{ playbook_dir }}/../tasks/verify_feature_rescue.yml"
          vars:
            feature_id: availability_zones
            fail_detail: "availability zones do not match expected count"

    # --- audit_logging ---
    - name: "CHECK: Log Forwarding (via AWS CLI)"
      when: "'audit_logging' in requested_features_list"
      vars:
        verify_region: "{{ aws_region | default(rcp.spec.region | default('us-west-2')) }}"
      block:
        - name: Assert at least one complete log destination is configured
          assert:
            that:
              - >-
                (log_forward_cloudwatch_role_arn is defined
                 and log_forward_cloudwatch_role_arn | length > 0
                 and log_forward_cloudwatch_log_group is defined
                 and log_forward_cloudwatch_log_group | length > 0) or
                (log_forward_s3_bucket is defined
                 and log_forward_s3_bucket | length > 0)
            fail_msg: >-
              FAIL: No complete log forwarding destination configured —
              provide both log_forward_cloudwatch_role_arn and
              log_forward_cloudwatch_log_group, or
              log_forward_s3_bucket
            success_msg: "PASS: Complete log destination configured"

        - name: Verify CloudWatch IAM role exists (boto3)
          command:
            argv:
              - python3
              - -c
              - |
                import boto3, os
                iam = boto3.client('iam')
                import re
                m = re.search(r'role/(?:.*/)?(.+)$', os.environ['ROLE_ARN'])
                role_name = m.group(1) if m else os.environ['ROLE_ARN'].rsplit('/', 1)[-1]
                r = iam.get_role(RoleName=role_name)
                print(r['Role']['Arn'])
          environment:
            ROLE_ARN: "{{ log_forward_cloudwatch_role_arn }}"
          register: boto3_cw_role_check
          changed_when: false
          failed_when: false
          no_log: true
          when: boto3_check.rc == 0 and log_forward_cloudwatch_role_arn is defined and (log_forward_cloudwatch_role_arn | length > 0)

        - name: Assert CloudWatch IAM role exists
          assert:
            that:
              - boto3_cw_role_check.rc == 0
              - boto3_cw_role_check.stdout | trim == log_forward_cloudwatch_role_arn
            fail_msg: "FAIL: CloudWatch IAM role not found in AWS"
            success_msg: "PASS: CloudWatch IAM role exists"
          when: boto3_check.rc == 0 and log_forward_cloudwatch_role_arn is defined and (log_forward_cloudwatch_role_arn | length > 0)

        - name: Verify CloudWatch log group exists (boto3)
          command:
            argv:
              - python3
              - -c
              - |
                import boto3, os
                logs = boto3.client('logs', region_name=os.environ['VERIFY_REGION'])
                group = os.environ['LOG_GROUP']
                r = logs.describe_log_groups(logGroupNamePrefix=group)
                matches = [g['logGroupName'] for g in r['logGroups'] if g['logGroupName'] == group]
                print(matches[0] if matches else '')
          environment:
            VERIFY_REGION: "{{ verify_region }}"
            LOG_GROUP: "{{ log_forward_cloudwatch_log_group }}"
          register: boto3_cw_log_group_check
          changed_when: false
          failed_when: false
          when: boto3_check.rc == 0 and log_forward_cloudwatch_log_group is defined and (log_forward_cloudwatch_log_group | length > 0)

        - name: Assert CloudWatch log group exists
          assert:
            that:
              - boto3_cw_log_group_check.rc == 0
              - boto3_cw_log_group_check.stdout | trim == log_forward_cloudwatch_log_group
            fail_msg: "FAIL: CloudWatch log group not found in the specified region"
            success_msg: "PASS: CloudWatch log group exists"
          when: boto3_check.rc == 0 and log_forward_cloudwatch_log_group is defined and (log_forward_cloudwatch_log_group | length > 0)

        - name: Verify S3 bucket exists (boto3)
          command:
            argv:
              - python3
              - -c
              - |
                import boto3, os
                s3 = boto3.client('s3')
                s3.head_bucket(Bucket=os.environ['BUCKET_NAME'])
                print('exists')
          environment:
            BUCKET_NAME: "{{ log_forward_s3_bucket }}"
          register: boto3_s3_bucket_check
          changed_when: false
          failed_when: false
          when: boto3_check.rc == 0 and log_forward_s3_bucket is defined and (log_forward_s3_bucket | length > 0)

        - name: Assert S3 bucket exists
          assert:
            that:
              - boto3_s3_bucket_check.rc == 0
            fail_msg: "FAIL: S3 bucket not found in AWS"
            success_msg: "PASS: S3 bucket exists"
          when: boto3_check.rc == 0 and log_forward_s3_bucket is defined and (log_forward_s3_bucket | length > 0)

        - set_fact:
            features_passed: "{{ features_passed | int + 1 }}"
      rescue:
        - include_tasks: "{{ playbook_dir }}/../tasks/verify_feature_rescue.yml"
          vars:
            feature_id: audit_logging
            fail_detail: "log forwarding destinations not found in AWS"

    # --- proxy_enabled ---
    - name: "CHECK: Proxy Configuration (via OCM API)"
      when: "'proxy_enabled' in requested_features_list"
      block:
        - name: Assert proxy via OCM
          assert:
            that:
              - ocm_cluster.proxy is defined
              - >-
                (ocm_cluster.proxy.http_proxy is defined and ocm_cluster.proxy.http_proxy | length > 0) or
                (ocm_cluster.proxy.https_proxy is defined and ocm_cluster.proxy.https_proxy | length > 0)
            fail_msg: "FAIL: OCM proxy config missing or no http_proxy/https_proxy set"
            success_msg: "PASS: OCM confirms proxy is configured"
          when: ocm_available

        - name: Assert proxy via CRD (fallback)
          assert:
            that:
              - rcp.spec.proxy is defined
              - >-
                (rcp.spec.proxy.httpProxy is defined and rcp.spec.proxy.httpProxy | length > 0) or
                (rcp.spec.proxy.httpsProxy is defined and rcp.spec.proxy.httpsProxy | length > 0)
            fail_msg: "FAIL: proxy not set or missing httpProxy/httpsProxy"
            success_msg: "PASS: proxy configured with httpProxy and/or httpsProxy (CRD fallback)"
          when: not ocm_available

        - set_fact:
            features_passed: "{{ features_passed | int + 1 }}"
      rescue:
        - include_tasks: "{{ playbook_dir }}/../tasks/verify_feature_rescue.yml"
          vars:
            feature_id: proxy_enabled
            fail_detail: "proxy is not configured"

    # ================================================================
    # SUMMARY
    # ================================================================
    - name: Build passed features list
      set_fact:
        results_passed: >-
          {{ requested_features_list
             | difference(results_warned | map('regex_replace', ':.*', '') | list)
             | difference(results_failed | map('regex_replace', ':.*', '') | list) }}

    - name: Feature verification summary
      debug:
        msg: |

          ═══════════════════════════════════════════════════════════════
          FEATURE FLAG VERIFICATION SUMMARY
          ═══════════════════════════════════════════════════════════════

          Cluster: {{ cluster_name | default('') | truncate(4, true, '****', 0) }}
          Namespace: {{ rosa_hcp_namespace | default('') | truncate(4, true, '****', 0) }}
          Cluster Version: {{ rcp.spec.version | default('unknown') }}
          OpenShift Version: {{ hub_ocp_version }}
          MCE Version: {{ mce_version }}
          CAPA Image: {{ capa_image }}
          Requested: {{ requested_features_list | join(', ') | default('none', true) }}

          ───────────────────────────────────────────────────────────────
          PASSED ({{ results_passed | length }}):
          {% for f in results_passed %}
            ✓ {{ f }}
          {% endfor %}
          {% if results_passed | length == 0 %}
            (none)
          {% endif %}

          {% if results_warned | length > 0 %}
          WARNED ({{ results_warned | length }}) — CRD does not support field:
          {% for w in results_warned %}
            ⚠ {{ w }}
          {% endfor %}

          {% endif %}
          {% if results_failed | length > 0 %}
          FAILED ({{ results_failed | length }}) — requested and CRD supports it, but missing:
          {% for f in results_failed %}
            ✗ {{ f }}
          {% endfor %}

          {% endif %}
          ═══════════════════════════════════════════════════════════════

    - name: Warn about CRD limitations
      debug:
        msg: "{{ results_warned | length }} feature(s) not supported by installed CRD version — platform limitation, not a test failure."
      when: results_warned | length > 0

    - name: Fail if any CRD-supported features are missing from spec
      fail:
        msg: >
          {{ results_failed | length }} requested feature(s) not found in cluster spec:
          {% for f in results_failed %}{{ f }}; {% endfor %}
      when: results_failed | length > 0
