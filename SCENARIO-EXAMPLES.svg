<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 850" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 36px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; fill: #666; line-height: 1.5; }
      .scenario-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600; fill: #1a1a1a; }
      .scenario-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #555; line-height: 1.4; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; fill: #999; text-transform: uppercase; letter-spacing: 1px; }
      .feature-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 500; fill: white; }
      .var-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #555; line-height: 1.5; }
      .var-value { font-family: 'Monaco', 'Courier New', monospace; font-size: 10px; fill: #1a1a1a; }
      .timing { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #f59e0b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="820" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="60" y="60" class="title">Scenario Examples: Ready-Made Test Configurations</text>
  <text x="60" y="90" class="subtitle">Complete setup with features, extra vars, and timing for each scenario</text>

  <!-- SCENARIO 1: day1-basic -->
  <g>
    <rect x="40" y="120" width="630" height="320" fill="white" stroke="#e0e0e0" stroke-width="2" rx="8"/>

    <!-- Color accent -->
    <rect x="40" y="120" width="8" height="320" fill="#3498db" rx="8"/>

    <!-- Name and description -->
    <text x="70" y="150" class="scenario-name">day1-basic</text>
    <text x="70" y="172" class="scenario-desc">Baseline provisioning: domain prefix, AZs, tags, channel group, default autoscaling</text>

    <!-- Features -->
    <text x="70" y="200" class="section-label">Features</text>
    <g>
      <rect x="70" y="213" width="75" height="18" fill="#3498db" rx="3"/>
      <text x="107" y="223" class="feature-tag" text-anchor="middle">domain_prefix</text>

      <rect x="155" y="213" width="110" height="18" fill="#3498db" rx="3"/>
      <text x="210" y="223" class="feature-tag" text-anchor="middle">availability_zones</text>

      <rect x="275" y="213" width="90" height="18" fill="#3498db" rx="3"/>
      <text x="320" y="223" class="feature-tag" text-anchor="middle">additional_tags</text>

      <rect x="375" y="213" width="85" height="18" fill="#3498db" rx="3"/>
      <text x="417" y="223" class="feature-tag" text-anchor="middle">channel_group</text>

      <rect x="470" y="213" width="85" height="18" fill="#3498db" rx="3"/>
      <text x="512" y="223" class="feature-tag" text-anchor="middle">autoscaling</text>
    </g>

    <!-- Extra vars -->
    <text x="70" y="250" class="section-label">Default Extra Vars</text>
    <text x="70" y="273" class="var-label">domain_prefix: [user-provided]</text>
    <text x="70" y="294" class="var-label">availability_zone_count: 2</text>
    <text x="70" y="315" class="var-label">additional_tags: {Team: PICS, Jira: RHACM4K-61815}</text>
    <text x="70" y="336" class="var-label">channel_group: stable</text>
    <text x="70" y="357" class="var-label">default_autoscaling: true</text>

    <!-- Timing -->
    <text x="70" y="390" class="timing">Estimated: 75 minutes</text>
  </g>

  <!-- SCENARIO 2: day1-security -->
  <g>
    <rect x="710" y="120" width="630" height="320" fill="white" stroke="#e0e0e0" stroke-width="2" rx="8"/>

    <!-- Color accent -->
    <rect x="710" y="120" width="8" height="320" fill="#27ae60" rx="8"/>

    <!-- Name and description -->
    <text x="740" y="150" class="scenario-name">day1-security</text>
    <text x="740" y="172" class="scenario-desc">Security features: etcd KMS encryption, FIPS, security groups</text>

    <!-- Features -->
    <text x="740" y="200" class="section-label">Features</text>
    <g>
      <rect x="740" y="213" width="70" height="18" fill="#27ae60" rx="3"/>
      <text x="775" y="223" class="feature-tag" text-anchor="middle">etcd_kms</text>

      <rect x="815" y="213" width="55" height="18" fill="#27ae60" rx="3"/>
      <text x="842" y="223" class="feature-tag" text-anchor="middle">fips</text>

      <rect x="875" y="213" width="105" height="18" fill="#27ae60" rx="3"/>
      <text x="927" y="223" class="feature-tag" text-anchor="middle">security_groups</text>
    </g>

    <!-- Extra vars -->
    <text x="740" y="265" class="section-label">Required Extra Vars</text>
    <text x="740" y="288" class="var-label">etcd_encryption_kms_arn: ${ETCD_KMS_ARN}</text>
    <text x="740" y="309" class="var-label" fill="#c0392b">(must be set in environment)</text>

    <text x="740" y="332" class="section-label">Auto-Generated Setup</text>
    <text x="740" y="355" class="var-label">security_groups: [created during provisioning]</text>
    <text x="740" y="376" class="var-label">fips: true</text>

    <!-- Timing -->
    <text x="740" y="405" class="timing">Estimated: 80 minutes</text>
  </g>

  <!-- SCENARIO 3: day1-networking -->
  <g>
    <rect x="40" y="440" width="630" height="360" fill="white" stroke="#e0e0e0" stroke-width="2" rx="8"/>

    <!-- Color accent -->
    <rect x="40" y="440" width="8" height="360" fill="#f39c12" rx="8"/>

    <!-- Name and description -->
    <text x="70" y="460" class="scenario-name">day1-networking</text>
    <text x="70" y="478" class="scenario-desc">Network/auth features: no-CNI, private endpoint, OIDC, audit log forwarding</text>

    <!-- Features -->
    <text x="70" y="500" class="section-label">Features</text>
    <g>
      <rect x="70" y="513" width="75" height="18" fill="#f39c12" rx="3"/>
      <text x="107" y="523" class="feature-tag" text-anchor="middle">no_cni</text>

      <rect x="150" y="513" width="105" height="18" fill="#f39c12" rx="3"/>
      <text x="202" y="523" class="feature-tag" text-anchor="middle">private_network</text>

      <rect x="260" y="513" width="95" height="18" fill="#f39c12" rx="3"/>
      <text x="307" y="523" class="feature-tag" text-anchor="middle">external_oidc</text>

      <rect x="360" y="513" width="95" height="18" fill="#f39c12" rx="3"/>
      <text x="407" y="523" class="feature-tag" text-anchor="middle">audit_logging</text>
    </g>

    <!-- Extra vars -->
    <text x="70" y="565" class="section-label">Required Extra Vars</text>
    <text x="70" y="584" class="var-label">no_cni: true</text>
    <text x="70" y="601" class="var-label">private: true (endpointAccess: Private)</text>
    <text x="70" y="618" class="var-label">external_oidc: true</text>
    <text x="70" y="635" class="var-label">log_forward_s3_bucket: ${CAPI_TEST_LOG_S3_BUCKET}</text>
    <text x="70" y="652" class="var-label" fill="#c0392b">(S3 bucket must exist and be set in environment)</text>

    <!-- OCP versions -->
    <text x="70" y="680" class="section-label">Supported Versions</text>
    <text x="70" y="699" class="var-label">4.21, 4.23, 5.0 (no-CNI and OIDC require 4.19+)</text>

    <!-- Timing -->
    <text x="70" y="727" class="timing">Estimated: 85 minutes (networking overhead)</text>
  </g>

  <!-- SCENARIO 4: day2-machinepool -->
  <g>
    <rect x="710" y="440" width="630" height="360" fill="white" stroke="#e0e0e0" stroke-width="2" rx="8"/>

    <!-- Color accent -->
    <rect x="710" y="440" width="8" height="360" fill="#9b59b6" rx="8"/>

    <!-- Name and description -->
    <text x="740" y="460" class="scenario-name">day2-machinepool</text>
    <text x="740" y="478" class="scenario-desc">Day-2 machine pool lifecycle: provision, add pool, delete, tear down</text>

    <!-- Features (reuses day1-basic) -->
    <text x="740" y="500" class="section-label">Features (day1-basic + orchestration)</text>
    <g>
      <rect x="740" y="513" width="90" height="18" fill="#9b59b6" rx="3"/>
      <text x="785" y="523" class="feature-tag" text-anchor="middle">domain_prefix</text>

      <rect x="835" y="513" width="100" height="18" fill="#9b59b6" rx="3"/>
      <text x="885" y="523" class="feature-tag" text-anchor="middle">machine_pools</text>

      <rect x="940" y="513" width="90" height="18" fill="#9b59b6" rx="3"/>
      <text x="985" y="523" class="feature-tag" text-anchor="middle">autoscaling</text>
    </g>

    <!-- Stages -->
    <text x="740" y="565" class="section-label">Execution Stages (in order)</text>
    <text x="740" y="592" class="var-label">10-configure-mce-environment</text>
    <text x="740" y="609" class="var-label">20-rosa-hcp-provision</text>
    <text x="740" y="626" class="var-label">21-verify-feature-flags</text>
    <text x="740" y="643" class="var-label">27-rosa-hcp-add-machinepool (create pool)</text>
    <text x="740" y="660" class="var-label">28-rosa-hcp-delete-machinepool (always run, cleanup pool)</text>
    <text x="740" y="677" class="var-label">30-rosa-hcp-delete (always run, cleanup cluster)</text>

    <!-- OCP versions -->
    <text x="740" y="705" class="section-label">Supported Versions</text>
    <text x="740" y="724" class="var-label">4.21, 4.23, 5.0 (machine pool capable releases)</text>

    <!-- Timing -->
    <text x="740" y="750" class="timing">Estimated: 90 minutes (includes day-2 operations)</text>
  </g>


</svg>
