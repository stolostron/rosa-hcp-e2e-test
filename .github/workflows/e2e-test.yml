name: E2E Test

on:
  workflow_dispatch:
    inputs:
      test-suite:
        description: Which test suite to run
        required: true
        type: choice
        options:
          - smoke
          - full
        default: smoke
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  e2e-smoke:
    name: E2E Smoke (CRC)
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      ${{ github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          'external' || '' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Checkout PR code
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Start CRC OpenShift cluster
        uses: crc-org/crc-github-action@c32030519c129bdaeedf2f313670831c2195526e # v1
        with:
          pull-secret: ${{ secrets.CRC_PULL_SECRET }}
          preset: openshift

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ansible
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements.yml ]; then ansible-galaxy install -r requirements.yml; fi

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Run smoke tests
        env:
          OCM_CLIENT_ID: ${{ secrets.OCM_CLIENT_ID }}
          OCM_CLIENT_SECRET: ${{ secrets.OCM_CLIENT_SECRET }}
          OCM_API_URL: ${{ secrets.OCM_API_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          DEPLOYMENT_MODE: standalone
        run: make crc-smoke

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-smoke-logs
          path: logs/
          retention-days: 14

      - name: Delete CRC cluster
        if: always()
        run: crc delete -f || true

  e2e-full:
    name: E2E Full Lifecycle (CRC)
    if: github.event_name == 'workflow_dispatch' && inputs.test-suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Start CRC OpenShift cluster
        uses: crc-org/crc-github-action@c32030519c129bdaeedf2f313670831c2195526e # v1
        with:
          pull-secret: ${{ secrets.CRC_PULL_SECRET }}
          preset: openshift

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ansible
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements.yml ]; then ansible-galaxy install -r requirements.yml; fi

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Run full lifecycle tests
        env:
          OCM_CLIENT_ID: ${{ secrets.OCM_CLIENT_ID }}
          OCM_CLIENT_SECRET: ${{ secrets.OCM_CLIENT_SECRET }}
          OCM_API_URL: ${{ secrets.OCM_API_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          DEPLOYMENT_MODE: standalone
        run: make crc-full

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-full-logs
          path: logs/
          retention-days: 14

      - name: Delete CRC cluster
        if: always()
        run: crc delete -f || true
